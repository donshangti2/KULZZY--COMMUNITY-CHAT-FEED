<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Kulzzy Radio Community Chat</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#001b2b;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

/* ==============================
   PROFILE
============================== */

.profile-area{
    width:100%;
    padding:18px 15px 12px;
    background:#00263a;
    border-bottom:1px solid #07506d;
}

.profile-row{
    display:flex;
    align-items:center;
    gap:14px;
}

.profile-picture-wrap{
    width:78px;
    height:78px;
    min-width:78px;
    border-radius:50%;
    border:3px solid #ffd000;
    overflow:hidden;
    background:#073449;
    display:flex;
    align-items:center;
    justify-content:center;
}

.profile-picture{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.profile-placeholder{
    font-size:38px;
    color:#ffd000;
}

.profile-info{
    flex:1;
    min-width:0;
}

.name-display{
    font-size:21px;
    font-weight:bold;
    color:#ffd000;
    margin-bottom:8px;
    word-break:break-word;
}

.profile-stats{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    font-size:14px;
}

.followers-count{
    color:#fff;
}

.notification-count{
    color:#ffd000;
}

.profile-edit{
    margin-top:15px;
    display:none;
}

.profile-edit.show{
    display:block;
}

.name-input{
    width:100%;
    height:48px;
    border:0;
    outline:none;
    border-radius:14px;
    padding:0 15px;
    font-size:17px;
    background:#fff;
    color:#111;
}

.profile-file{
    width:100%;
    margin-top:10px;
    padding:12px;
    border-radius:12px;
    background:#00466b;
    color:white;
}

.save-profile{
    width:100%;
    margin-top:10px;
    height:45px;
    border:2px solid #ffd000;
    border-radius:12px;
    background:#ffd000;
    color:#00263a;
    font-size:17px;
    font-weight:bold;
}

/* ==============================
   COMMUNITY FEED
============================== */

.community{
    width:100%;
    padding:10px 10px 150px;
}

.community-info{
    background:#082633;
    border:1px solid #104b61;
    border-radius:14px;
    padding:16px;
    text-align:center;
    color:#dce7eb;
    font-size:17px;
    line-height:1.5;
    margin-bottom:12px;
}

/* ==============================
   POSTS
============================== */

.post-card{
    width:100%;
    background:#002b3d;
    border:1px solid #07506a;
    border-radius:16px;
    overflow:hidden;
    margin-bottom:14px;
}

.post-header{
    display:flex;
    align-items:center;
    padding:12px;
    gap:10px;
}

.post-profile{
    width:52px;
    height:52px;
    min-width:52px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #ffd000;
    background:#073449;
}

.post-user{
    flex:1;
    min-width:0;
}

.post-name{
    color:#ffd000;
    font-weight:bold;
    font-size:17px;
    word-break:break-word;
}

.post-time{
    color:#9fb2bb;
    font-size:12px;
    margin-top:3px;
}

.follow-btn{
    border:1px solid #ffd000;
    background:transparent;
    color:#ffd000;
    border-radius:20px;
    padding:8px 13px;
    font-size:13px;
    font-weight:bold;
    white-space:nowrap;
}

.follow-btn.following{
    background:#ffd000;
    color:#002b3d;
}

.post-image{
    width:100%;
    max-height:520px;
    object-fit:cover;
    display:block;
    background:#001722;
}

.post-actions{
    display:flex;
    align-items:center;
    min-height:52px;
    padding:7px 12px;
    border-top:1px solid #084a61;
    border-bottom:1px solid #084a61;
    gap:18px;
}

.action-btn{
    border:0;
    background:transparent;
    color:white;
    font-size:15px;
    padding:8px 2px;
}

.like-btn.liked{
    color:#ff405d;
}

.views{
    margin-left:auto;
    color:#d7e2e6;
}

.post-text{
    padding:12px 14px 15px;
    font-size:17px;
    line-height:1.45;
    word-wrap:break-word;
}

.comment-area{
    display:none;
    padding:8px 12px 12px;
}

.comment-area.show{
    display:block;
}

.comment-input-row{
    display:flex;
    gap:8px;
}

.comment-input{
    flex:1;
    min-width:0;
    border:1px solid #23627a;
    background:#061e29;
    color:white;
    border-radius:20px;
    padding:10px 14px;
    outline:none;
    font-size:15px;
}

.comment-send{
    border:0;
    border-radius:20px;
    background:#ffd000;
    color:#002b3d;
    padding:0 15px;
    font-weight:bold;
}

.comments-list{
    margin-top:8px;
}

.comment{
    padding:8px 10px;
    background:#061f2a;
    border-radius:10px;
    margin-top:6px;
    font-size:14px;
}

.comment strong{
    color:#ffd000;
}

/* ==============================
   CHAT
============================== */

.chat-list{
    width:100%;
}

.chat-message{
    max-width:82%;
    width:max-content;
    min-width:80px;
    background:#142f3a;
    border-radius:5px 14px 14px 14px;
    padding:9px 13px;
    margin:7px 5px;
    word-wrap:break-word;
    overflow-wrap:anywhere;
}

.chat-name{
    color:#00c9a7;
    font-weight:bold;
    font-size:14px;
    margin-bottom:4px;
}

.chat-text{
    color:white;
    font-size:17px;
    line-height:1.4;
}

.chat-time{
    color:#9db0b8;
    font-size:10px;
    margin-top:4px;
    text-align:right;
}

/* ==============================
   BOTTOM COMPOSER
============================== */

.composer{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:1000;
    background:#002b3d;
    border-top:1px solid #0b607c;
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));
}

.composer-row{
    display:flex;
    align-items:flex-end;
    gap:8px;
    width:100%;
}

.composer-button{
    width:52px;
    height:52px;
    min-width:52px;
    border:0;
    border-radius:50%;
    background:#ffd000;
    color:#002b3d;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

.message-box{
    flex:1;
    min-width:0;
    max-height:130px;
    min-height:52px;
    resize:none;
    overflow-y:auto;
    border:0;
    outline:none;
    border-radius:28px;
    background:white;
    color:#111;
    padding:14px 18px;
    font-size:17px;
    line-height:1.35;
    font-family:Arial,Helvetica,sans-serif;
}

.message-box::placeholder{
    color:#777;
}

.hidden-file{
    display:none;
}

/* ==============================
   PROFILE REQUIRED
============================== */

.required-message{
    position:fixed;
    left:50%;
    bottom:85px;
    transform:translateX(-50%);
    width:calc(100% - 30px);
    max-width:500px;
    background:#ffd000;
    color:#002b3d;
    padding:12px 15px;
    border-radius:12px;
    text-align:center;
    font-weight:bold;
    z-index:1100;
    display:none;
}

.required-message.show{
    display:block;
}

/* ==============================
   MODAL
============================== */

.profile-modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    z-index:2000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.profile-modal.show{
    display:flex;
}

.profile-box{
    width:100%;
    max-width:430px;
    background:#002b3d;
    border:2px solid #ffd000;
    border-radius:18px;
    padding:20px;
}

.profile-box h3{
    margin:0 0 15px;
    color:#ffd000;
    text-align:center;
}

.close-profile{
    width:100%;
    margin-top:10px;
    height:42px;
    border:1px solid #ffd000;
    border-radius:10px;
    background:transparent;
    color:#ffd000;
    font-weight:bold;
}

/* ==============================
   TOAST
============================== */

.toast{
    position:fixed;
    left:50%;
    bottom:85px;
    transform:translateX(-50%);
    background:#ffd000;
    color:#002b3d;
    padding:11px 17px;
    border-radius:12px;
    font-weight:bold;
    z-index:3000;
    display:none;
    max-width:90%;
    text-align:center;
}

.toast.show{
    display:block;
}

@media(max-width:500px){

    .profile-picture-wrap{
        width:70px;
        height:70px;
        min-width:70px;
    }

    .name-display{
        font-size:19px;
    }

    .follow-btn{
        padding:7px 10px;
    }

    .post-image{
        max-height:430px;
    }

    .composer-button{
        width:50px;
        height:50px;
        min-width:50px;
    }

}

</style>

</head>

<body>

<!-- ==============================
     PROFILE
============================== -->

<section class="profile-area">

    <div class="profile-row">

        <div class="profile-picture-wrap">

            <img
                id="myProfilePicture"
                class="profile-picture"
                src=""
                alt=""
                style="display:none;"
            >

            <span
                id="profilePlaceholder"
                class="profile-placeholder">
                👤
            </span>

        </div>

        <div class="profile-info">

            <div
                id="myName"
                class="name-display">
                Set your profile
            </div>

            <div class="profile-stats">

                <span>
                    👥
                    <span id="myFollowers">0</span>
                    Followers
                </span>

                <span class="notification-count">
                    🔔
                    <span id="myNotifications">0</span>
                </span>

            </div>

        </div>

    </div>

</section>


<!-- ==============================
     COMMUNITY
============================== -->

<main class="community">

    <div class="community-info">

        Kulzzy Radio Live Community.<br>
        Start chatting with listeners around the world.

    </div>

    <div id="posts"></div>

    <div id="chatList" class="chat-list"></div>

</main>


<!-- ==============================
     BOTTOM COMPOSER
============================== -->

<div class="composer">

    <div class="composer-row">

        <!-- CAMERA -->

        <button
            id="cameraBtn"
            class="composer-button"
            type="button"
            title="Camera">
            📷
        </button>

        <!-- MESSAGE -->

        <textarea
            id="message"
            class="message-box"
            rows="1"
            placeholder="Type a message..."
            maxlength="2000"></textarea>

        <!-- UPLOAD -->

        <button
            id="uploadBtn"
            class="composer-button"
            type="button"
            title="Upload picture">
            🖼️
        </button>

        <!-- SEND -->

        <button
            id="sendBtn"
            class="composer-button"
            type="button"
            title="Send">
            ➤
        </button>

    </div>

</div>


<input
    id="cameraInput"
    class="hidden-file"
    type="file"
    accept="image/*"
    capture="environment"
>

<input
    id="uploadInput"
    class="hidden-file"
    type="file"
    accept="image/*"
>


<!-- ==============================
     PROFILE MODAL
============================== -->

<div id="profileModal" class="profile-modal">

    <div class="profile-box">

        <h3>Set Your Profile</h3>

        <input
            id="profileNameInput"
            class="name-input"
            type="text"
            maxlength="40"
            placeholder="Write your name"
        >

        <input
            id="profilePictureInput"
            class="profile-file"
            type="file"
            accept="image/*"
        >

        <button
            id="saveProfileBtn"
            class="save-profile"
            type="button">
            SAVE PROFILE
        </button>

        <button
            id="closeProfileBtn"
            class="close-profile"
            type="button">
            CANCEL
        </button>

    </div>

</div>


<div
    id="requiredMessage"
    class="required-message">
    Please save your profile picture and name before sending a message.
</div>

<div id="toast" class="toast"></div>


<script type="module">

/* ============================================================
   FIREBASE
============================================================ */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    set,
    update,
    get,
    onValue,
    onChildAdded,
    onChildChanged,
    runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyBH85NGWsSAK5cubbPdnmunwYZFZpj_CB0",

    authDomain:
        "kulzzy-radio-chat.firebaseapp.com",

    databaseURL:
        "https://kulzzy-radio-chat-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "kulzzy-radio-chat",

    storageBucket:
        "kulzzy-radio-chat.firebasestorage.app",

    messagingSenderId:
        "510100635134",

    appId:
        "1:510100635134:web:9d3b2e983eb6e9a385d4af"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


/* ============================================================
   CLOUDINARY
============================================================ */

const CLOUDINARY_CLOUD_NAME =
    "s4j0x7dk";

/*
 IMPORTANT:
 Put your actual Cloudinary UNSIGNED upload preset here.

 If your preset is named "Community Chat",
 keep the value below as:

 "Community Chat"

 If Cloudinary uses another preset name,
 change only this value.
*/

const CLOUDINARY_UPLOAD_PRESET =
    "Community Chat";


/* ============================================================
   ELEMENTS
============================================================ */

const myName =
    document.getElementById("myName");

const myProfilePicture =
    document.getElementById("myProfilePicture");

const profilePlaceholder =
    document.getElementById("profilePlaceholder");

const myFollowers =
    document.getElementById("myFollowers");

const myNotifications =
    document.getElementById("myNotifications");

const posts =
    document.getElementById("posts");

const chatList =
    document.getElementById("chatList");

const messageBox =
    document.getElementById("message");

const sendBtn =
    document.getElementById("sendBtn");

const uploadBtn =
    document.getElementById("uploadBtn");

const cameraBtn =
    document.getElementById("cameraBtn");

const uploadInput =
    document.getElementById("uploadInput");

const cameraInput =
    document.getElementById("cameraInput");

const profileModal =
    document.getElementById("profileModal");

const profileNameInput =
    document.getElementById("profileNameInput");

const profilePictureInput =
    document.getElementById("profilePictureInput");

const saveProfileBtn =
    document.getElementById("saveProfileBtn");

const closeProfileBtn =
    document.getElementById("closeProfileBtn");

const requiredMessage =
    document.getElementById("requiredMessage");

const toast =
    document.getElementById("toast");


/* ============================================================
   LISTENER ID
============================================================ */

let listenerId =
    localStorage.getItem("kulzzyListenerId");

if (!listenerId) {

    listenerId =
        "listener_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2,9);

    localStorage.setItem(
        "kulzzyListenerId",
        listenerId
    );

}


/* ============================================================
   LOCAL PROFILE
============================================================ */

let profile =
    JSON.parse(
        localStorage.getItem("kulzzyCommunityProfile") ||
        "null"
    );


function hasProfile(){

    return !!(
        profile &&
        profile.name &&
        profile.name.trim() &&
        profile.photo
    );

}


/* ============================================================
   TOAST
============================================================ */

let toastTimer;

function showToast(text){

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        },3000);

}


/* ============================================================
   PROFILE DISPLAY
============================================================ */

function displayProfile(){

    if (!hasProfile()){

        myName.textContent =
            "Set your profile";

        myProfilePicture.style.display =
            "none";

        profilePlaceholder.style.display =
            "block";

        return;

    }


    myName.textContent =
        profile.name;

    myProfilePicture.src =
        profile.photo;

    myProfilePicture.style.display =
        "block";

    profilePlaceholder.style.display =
        "none";


    loadFollowerCount(
        listenerId
    );

}


displayProfile();


/* ============================================================
   OPEN PROFILE
============================================================ */

function openProfile(){

    profileNameInput.value =
        profile?.name || "";

    profileModal.classList.add("show");

}


/*
 If there is no profile, require one
 before chat can be used.
*/

if (!hasProfile()){

    setTimeout(() => {

        openProfile();

    },700);

}


myName.addEventListener(
    "click",
    openProfile
);


/* ============================================================
   CLOSE PROFILE
============================================================ */

closeProfileBtn.onclick = () => {

    profileModal.classList.remove(
        "show"
    );

};


/* ============================================================
   CLOUDINARY UPLOAD
============================================================ */

async function uploadToCloudinary(file){

    if (!file)
        throw new Error(
            "No picture selected."
        );


    if (!file.type.startsWith("image/")){

        throw new Error(
            "Only pictures are allowed."
        );

    }


    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );

    formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
    );


    const response =
        await fetch(
            `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
            {
                method:"POST",
                body:formData
            }
        );


    const data =
        await response.json();


    if (!response.ok){

        throw new Error(
            data?.error?.message ||
            "Cloudinary upload failed."
        );

    }


    return data.secure_url;

}


/* ============================================================
   SAVE PROFILE
============================================================ */

saveProfileBtn.onclick =
async () => {

    const name =
        profileNameInput.value.trim();

    const file =
        profilePictureInput.files[0];


    if (!name){

        showToast(
            "Please write your name."
        );

        return;

    }


    /*
      If an existing picture is already saved,
      the user does not have to upload again.
    */

    if (!file && !profile?.photo){

        showToast(
            "Please upload your profile picture."
        );

        return;

    }


    saveProfileBtn.disabled =
        true;

    saveProfileBtn.textContent =
        "SAVING...";


    try{

        let photo =
            profile?.photo || "";


        if (file){

            photo =
                await uploadToCloudinary(
                    file
                );

        }


        profile = {

            id:
                listenerId,

            name:
                name,

            photo:
                photo,

            updatedAt:
                Date.now()

        };


        localStorage.setItem(
            "kulzzyCommunityProfile",
            JSON.stringify(profile)
        );


        await set(
            ref(
                db,
                "profiles/" +
                listenerId
            ),
            profile
        );


        displayProfile();


        profileModal.classList.remove(
            "show"
        );


        showToast(
            "Profile saved successfully."
        );


    }catch(error){

        console.error(error);

        showToast(
            error.message ||
            "Could not save profile."
        );

    }


    saveProfileBtn.disabled =
        false;

    saveProfileBtn.textContent =
        "SAVE PROFILE";

};


/* ============================================================
   PROFILE REQUIRED
============================================================ */

function requireProfile(){

    if (hasProfile())
        return true;


    requiredMessage.classList.add(
        "show"
    );


    setTimeout(() => {

        requiredMessage.classList.remove(
            "show"
        );

    },3500);


    openProfile();

    return false;

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ============================================================
   TIME
============================================================ */

function formatTime(timestamp){

    if (!timestamp)
        return "";

    return new Date(timestamp)
        .toLocaleTimeString(
            [],
            {
                hour:"numeric",
                minute:"2-digit"
            }
        );

}


/* ============================================================
   SEND TEXT MESSAGE
============================================================ */

sendBtn.onclick =
async () => {

    if (!requireProfile())
        return;


    const text =
        messageBox.value.trim();


    if (!text)
        return;


    sendBtn.disabled =
        true;


    try{

        await push(
            ref(db,"chat"),
            {

                uid:
                    listenerId,

                name:
                    profile.name,

                text:
                    text,

                time:
                    Date.now()

            }
        );


        messageBox.value =
            "";

        resizeMessageBox();


    }catch(error){

        console.error(error);

        showToast(
            "Message could not be sent."
        );

    }


    sendBtn.disabled =
        false;

};


/* ============================================================
   ENTER TO SEND
============================================================ */

messageBox.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendBtn.click();

        }

    }
);


/* ============================================================
   AUTO GROW MESSAGE BOX
============================================================ */

function resizeMessageBox(){

    messageBox.style.height =
        "auto";

    messageBox.style.height =
        Math.min(
            messageBox.scrollHeight,
            130
        ) + "px";

}


messageBox.addEventListener(
    "input",
    resizeMessageBox
);


/* ============================================================
   DISPLAY CHAT
============================================================ */

onChildAdded(
    ref(db,"chat"),
    snapshot => {

        const data =
            snapshot.val();

        if (!data)
            return;


        const message =
            document.createElement("div");

        message.className =
            "chat-message";


        message.innerHTML = `

            <div class="chat-name">
                ${escapeHTML(data.name)}
            </div>

            <div class="chat-text">
                ${escapeHTML(data.text)}
            </div>

            <div class="chat-time">
                ${formatTime(data.time)}
            </div>

        `;


        chatList.appendChild(
            message
        );


        window.scrollTo(
            0,
            document.body.scrollHeight
        );

    }
);

  /* ============================================================
   PROFILE FOLLOWER COUNT
============================================================ */

async function loadFollowerCount(uid){

/* ============================================================

============================================================ */

async function toggleFollow(
    targetUid,
    button,
    countElement
){

    if (!requireProfile())
        return;


    if (
        targetUid === listenerId
    ){

        showToast(
            "You cannot follow yourself."
        );

        return;

    }


    const followRef =
        ref(
            db,
            "followers/" +
            targetUid +
            "/" +
            listenerId
        );


    try{

        const snapshot =
            await get(
                followRef
            );


        if (snapshot.exists()){

            await set(
                followRef,
                null
            );

            button.textContent =
                "Follow Me";

            button.classList.remove(
                "following"
            );

        }else{

            await set(
                followRef,
                {

                    name:
                        profile.name,

                    time:
                        Date.now()

                }
            );


            button.textContent =
                "Following";

            button.classList.add(
                "following"
            );


            /*
              Notification for the person
              being followed.
            */

            await push(
                ref(
                    db,
                    "notifications/" +
                    targetUid
                ),
                {

                    type:
                        "follow",

                    fromUid:
                        listenerId,

                    fromName:
                        profile.name,

                    time:
                        Date.now(),

                    read:
                        false

                }
            );

        }


        loadPostFollowerCount(
            targetUid,
            countElement
        );


    }catch(error){

        console.error(error);

        showToast(
            "Follow action failed."
        );

    }

}

/* ============================================================
   POST VIEW COUNT
============================================================ */

async function registerPostView(
    postId,
    postElement
){

    if (!hasProfile())
        return;


    const sessionKey =
        "viewed_" +
        postId;


    if (
        sessionStorage.getItem(
            sessionKey
        )
    ){

        return;

    }


    sessionStorage.setItem(
        sessionKey,
        "1"
    );


    const viewRef =
        ref(
            db,
            "postViews/" +
            postId +
            "/" +
            listenerId
        );


    try{

        const result =
            await runTransaction(
                viewRef,
                current => {

                    if (
                        current !== null
                    ){

                        return current;

                    }

                    return {

                        uid:
                            listenerId,

                        name:
                            profile.name,

                        time:
                            Date.now()

                    };

                }
            );


        if (result.committed){

            const viewCount =
                postElement.querySelector(
                    ".view-count"
                );


            if (viewCount){

                const snapshot =
                    await get(
                        ref(
                            db,
                            "postViews/" +
                            postId
                        )
                    );


                const count =
                    snapshot.exists()
                    ?
                    Object.keys(
                        snapshot.val()
                    ).length
                    :
                    0;


                viewCount.textContent =
                    count;

            }

        }

    }catch(error){

        console.error(error);

    }

}

   CREATE POST
============================================================ */

async function createPicturePost(
    file
){

    if (!requireProfile())
        return;


    if (!file)
        return;


    if (!file.type.startsWith("image/")){

        showToast(
            "Only pictures are allowed."
        );

        return;

    }


    try{

        showToast(
            "Uploading picture..."
        );


        const imageUrl =
            await uploadToCloudinary(
                file
            );


        await push(
            ref(db,"communityPosts"),
            {

                uid:
                    listenerId,

                name:
                    profile.name,

                profilePhoto:
                    profile.photo,

                image:
                    imageUrl,

                time:
                    Date.now()

            }
        );


        showToast(
            "Picture posted."
        );


    }catch(error){

        console.error(error);

        showToast(
            error.message ||
            "Picture upload failed."
        );

    }

}

/* ============================================================
   RENDER POSTS
============================================================ */

onChildAdded(
    ref(db,"communityPosts"),
    snapshot => {

        const post =
            snapshot.val();

        if (!post)
            return;


        const postId =
            snapshot.key;


        const card =
            document.createElement("article");

        card.className =
            "post-card";


        card.innerHTML = `

            <div class="post-header">

                <img
                    class="post-profile"
                    src="${escapeHTML(post.profilePhoto || "")}"
                    alt=""
                >

                <div class="post-user">

                    <div class="post-name">
                        ${escapeHTML(post.name)}
                    </div>

                    <div class="post-time">
                        ${formatTime(post.time)}
                    </div>

                </div>

                <button
                    class="follow-btn"
                    type="button">
                    Follow Me
                </button>

            </div>


            <img
                class="post-image"
                src="${escapeHTML(post.image)}"
                alt="Community post"
                loading="lazy"
            >


            <div class="post-actions">

                <button
                    class="action-btn like-btn"
                    type="button">

                    ❤️
                    <span class="like-count">0</span>

                </button>


                <button
                    class="action-btn comment-btn"
                    type="button">

                    💬
                    Comment

                </button>


                <div class="views">

                    👁️
                    <span class="view-count">0</span>

                </div>

            </div>


            <div class="post-text"></div>


            <div class="comment-area">

                <div class="comment-input-row">

                    <input
                        class="comment-input"
                        type="text"
                        maxlength="500"
                        placeholder="Write a comment..."
                    >

                    <button
                        class="comment-send"
                        type="button">
                        Send
                    </button>

                </div>


                <div class="comments-list"></div>

            </div>

        `;


        posts.prepend(
            card
        );


        const followBtn =
            card.querySelector(
                ".follow-btn"
            );


        const likeBtn =
            card.querySelector(
                ".like-btn"
            );


        const likeCount =
            card.querySelector(
                ".like-count"
            );


        const commentBtn =
            card.querySelector(
                ".comment-btn"
            );


        const commentArea =
            card.querySelector(
                ".comment-area"
            );


        const commentInput =
            card.querySelector(
                ".comment-input"
            );


        const commentSend =
            card.querySelector(
                ".comment-send"
            );


        const commentsList =
            card.querySelector(
                ".comments-list"
            );


        const viewCount =
            card.querySelector(
                ".view-count"
            );


        const followersNumber =
            document.createElement(
                "span"
            );


        followersNumber.style.display =
            "none";


        followBtn.addEventListener(
            "click",
            () => {

                toggleFollow(
                    post.uid,
                    followBtn,
                    followersNumber
                );

            }
        );


        checkFollowing(
            post.uid,
            followBtn
        );


        loadPostFollowerCount(
            post.uid,
            followersNumber
        );


        likeBtn.addEventListener(
            "click",
            () => {

                toggleLike(
                    postId,
                    likeBtn,
                    likeCount,
                    post
                );

            }
        );


        loadLikeCount(
            postId,
            likeCount
        );


        commentBtn.addEventListener(
            "click",
            () => {

                commentArea.classList.toggle(
                    "show"
                );

            }
        );


        commentSend.addEventListener(
            "click",
            () => {

                addComment(
                    postId,
                    commentInput,
                    commentsList
                );

            }
        );


        commentInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ){

                    event.preventDefault();

                    commentSend.click();

                }

            }
        );


        onChildAdded(
            ref(
                db,
                "postComments/" +
                postId
            ),
            commentSnapshot => {

                const comment =
                    commentSnapshot.val();

                if (comment){

                    renderComment(
                        commentsList,
                        comment
                    );

                }

            }
        );


        /*
          View is registered when
          the post enters the screen.
        */

        const observer =
            new IntersectionObserver(
                entries => {

                    entries.forEach(
                        entry => {

                            if (
                                entry.isIntersecting
                            ){

                                registerPostView(
                                    postId,
                                    card
                                );

                                observer.disconnect();

                            }

                        }
                    );

                },
                {
                    threshold:0.45
                }
            );


        observer.observe(
            card
        );

    }
);


/* ============================================================
   NOTIFICATIONS
============================================================ */

function listenNotifications(){

    if (!hasProfile())
        return;


    const notificationRef =
        ref(
            db,
            "notifications/" +
            listenerId
        );


    onValue(
        notificationRef,
        snapshot => {

            let count =
                0;


            if (snapshot.exists()){

                snapshot.forEach(
                    child => {

                        const item =
                            child.val();

                        if (
                            item &&
                            item.read === false
                        ){

                            count++;

                        }

                    }
                );

            }


            myNotifications.textContent =
                count;

        }
    );

}


listenNotifications();

/* ============================================================
   CLICK NOTIFICATION COUNT
============================================================ */

myNotifications.parentElement.onclick =
async () => {

    if (!hasProfile())
        return;


    try{

        const snapshot =
            await get(
                ref(
                    db,
                    "notifications/" +
                    listenerId
                )
            );


        if (!snapshot.exists()){

            showToast(
                "No new notifications."
            );

            return;

        }


        const updates = {};


        snapshot.forEach(
            child => {

                updates[
                    child.key +
                    "/read"
                ] = true;

            }
        );


        await update(
            ref(
                db,
                "notifications/" +
                listenerId
            ),
            updates
        );


        showToast(
            "Notifications marked as read."
        );


    }catch(error){

        console.error(error);

    }

};
