<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Kulzzy Radio | Community Chat
</title>

<meta
name="theme-color"
content="#0b141a">

<link
rel="stylesheet"
href="css/style.css">


<style>

/* ==================================================
   KULZZY RADIO COMMUNITY CHAT
   COMPLETE WHATSAPP-STYLE INTERFACE
================================================== */

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;

    background:#0b141a;

    color:#e9edef;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

}


/* ==================================================
   ACTIVE LISTENERS
================================================== */

#activeListenersCard{

    width:100%;

    padding:14px 18px;

    background:#111b21;

    border-bottom:
    1px solid #26343b;

}


#activeListenersCard h2{

    margin:0 0 10px;

    font-size:18px;

    font-weight:600;

    color:#e9edef;

}


#activeListeners{

    display:flex;

    align-items:center;

    gap:10px;

    color:#aebac1;

    font-size:15px;

}


.listenerIcon{

    width:40px;

    height:40px;

    min-width:40px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#202c33;

    font-size:20px;

}


/* ==================================================
   PROFILE
================================================== */

#profileCard{

    width:100%;

    padding:10px 18px;

    background:#111b21;

    border-bottom:
    1px solid #26343b;

}


.profileRow{

    display:flex;

    align-items:center;

    gap:12px;

}


.profileImage{

    width:52px !important;

    height:52px !important;

    min-width:52px;

    border-radius:50% !important;

    object-fit:cover;

    background:#202c33;

    border:
    2px solid #00a884 !important;

}


.profileDetails{

    flex:1;

    min-width:0;

}


.profileDetails input[type="text"]{

    display:block;

    width:100%;

    max-width:420px;

    padding:5px 0;

    border:0;

    border-bottom:
    1px solid #39464d;

    outline:none;

    background:transparent;

    color:#e9edef;

    font-size:16px;

}


.profileDetails input[type="text"]:focus{

    border-bottom:
    2px solid #00a884;

}


.profileDetails h3{

    margin:4px 0;

    font-size:13px;

    font-weight:normal;

    color:#8696a0;

}


.profileFile{

    margin-top:3px;

}


.profileFile input{

    max-width:100%;

    color:#8696a0;

    font-size:11px;

}


/* ==================================================
   COMMUNITY CHAT
================================================== */

.chatCard{

    width:100%;

    max-width:900px;

    margin:0 auto;

    padding:0;

    background:#0b141a;

    border:0;

    border-radius:0;

}


/* ==================================================
   CHAT HEADER
================================================== */

.chatTitle{

    display:flex;

    align-items:center;

    gap:8px;

    width:100%;

    padding:12px 14px;

    background:#202c33;

    border-bottom:
    1px solid #39464d;

}


.chatTitle h2{

    flex:1;

    margin:0;

    font-size:20px;

    font-weight:600;

    color:#e9edef;

}


/* ==================================================
   POST BUTTON
================================================== */

.postButton{

    border:0;

    border-radius:20px;

    padding:8px 13px;

    background:#00a884;

    color:#ffffff;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;

}


.postButton:active{

    transform:scale(.96);

}


/* ==================================================
   NOTIFICATION BUTTON
================================================== */

.notificationButton{

    position:relative;

    width:40px;

    height:38px;

    border:0;

    border-radius:20px;

    background:#2a3942;

    color:#ffffff;

    font-size:17px;

    cursor:pointer;

}


.notificationBadge{

    position:absolute;

    top:-5px;

    right:-3px;

    min-width:18px;

    height:18px;

    padding:0 4px;

    border-radius:20px;

    background:#e53935;

    color:#ffffff;

    font-size:10px;

    display:none;

    align-items:center;

    justify-content:center;

}


/* ==================================================
   MESSAGE AREA
================================================== */

#messages{

    width:100%;

    height:58vh;

    min-height:400px;

    max-height:700px;

    overflow-y:auto;

    overflow-x:hidden;

    padding:
    15px
    10px
    25px;

    background:#0b141a;

}


/* ==================================================
   SYSTEM MESSAGE
================================================== */

.systemMessage{

    width:fit-content;

    max-width:90%;

    margin:
    8px auto
    18px;

    padding:
    9px
    13px;

    background:#182229;

    border-radius:8px;

    color:#8696a0;

    text-align:center;

    font-size:13px;

    line-height:1.5;

}


/* ==================================================
   TEXT MESSAGE
================================================== */

.communityMessage{

    width:fit-content;

    max-width:88%;

    margin:7px 0;

    padding:
    8px
    10px;

    background:#202c33;

    border-radius:
    8px
    8px
    8px
    2px;

    box-shadow:
    0 1px 2px
    rgba(0,0,0,.25);

}


.messageName{

    margin-bottom:3px;

    color:#00a884;

    font-size:13px;

    font-weight:bold;

}


.messageText{

    color:#e9edef;

    font-size:15px;

    line-height:1.45;

    word-break:break-word;

}


/* ==================================================
   PICTURE POST
================================================== */

.picturePost{

    width:90%;

    max-width:430px;

    margin:
    14px 0;

    padding:8px;

    background:#202c33;

    border-radius:10px;

}


/* ==================================================
   POST HEADER
================================================== */

.postHeader{

    display:flex;

    align-items:center;

    gap:10px;

    padding:
    4px
    5px
    9px;

}


.postAvatar{

    width:38px;

    height:38px;

    min-width:38px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#2a3942;

    font-size:18px;

}


.postUser{

    min-width:0;

}


.postUser strong{

    display:block;

    color:#e9edef;

    font-size:14px;

}


.postUser small{

    display:block;

    margin-top:2px;

    color:#8696a0;

    font-size:11px;

}


/* ==================================================
   POST IMAGE
================================================== */

.postImage{

    display:block;

    width:100%;

    max-height:430px;

    object-fit:cover;

    border-radius:7px;

    cursor:pointer;

}


/* ==================================================
   POST ACTIONS
================================================== */

.postActions{

    display:flex;

    align-items:center;

    gap:8px;

    padding:
    8px
    3px;

    border-top:
    1px solid
    rgba(255,255,255,.06);

}


.likeButton,
.commentButton{

    border:0;

    border-radius:18px;

    padding:
    7px
    11px;

    background:#2a3942;

    color:#e9edef;

    font-size:12px;

    cursor:pointer;

}


.likeButton.liked{

    background:#5b2730;

    color:#ff6b81;

}


.postViewCount{

    margin-left:auto;

    color:#8696a0;

    font-size:12px;

}


/* ==================================================
   COMMENTS
================================================== */

.commentArea{

    padding-top:7px;

    border-top:
    1px solid
    rgba(255,255,255,.06);

}


.comments{

    max-height:180px;

    overflow-y:auto;

}


.commentBubble{

    padding:
    6px
    8px;

    margin:
    4px 0;

    background:#182229;

    border-radius:7px;

    font-size:12px;

}


.commentBubble strong{

    margin-right:5px;

    color:#00a884;

}


.commentBubble span{

    color:#d9e1e5;

}


/* ==================================================
   COMMENT INPUT
================================================== */

.commentInputRow{

    display:flex;

    gap:5px;

    margin-top:7px;

}


.commentInput{

    flex:1;

    min-width:0;

    border:0;

    outline:none;

    border-radius:18px;

    padding:
    9px
    12px;

    background:#2a3942;

    color:#ffffff;

    font-size:13px;

}


.commentInput::placeholder{

    color:#8696a0;

}


.commentSend{

    width:38px;

    min-width:38px;

    height:38px;

    border:0;

    border-radius:50%;

    background:#00a884;

    color:#ffffff;

    cursor:pointer;

}


/* ==================================================
   CHAT INPUT
================================================== */

.chatBox{

    width:100%;

    padding:
    8px;

    background:#202c33;

    border-top:
    1px solid #26343b;

}


.chatBox textarea{

    display:block;

    width:100%;

    min-height:54px;

    max-height:130px;

    resize:none;

    border:0;

    outline:none;

    border-radius:25px;

    padding:
    15px
    18px;

    background:#2a3942;

    color:#e9edef;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    font-size:16px;

}


.chatBox textarea::placeholder{

    color:#8696a0;

}


/* ==================================================
   CHAT BUTTONS
================================================== */

.chatActions{

    display:flex;

    align-items:center;

    gap:8px;

    margin-top:8px;

}


.chatActions button{

    border:0;

    border-radius:20px;

    padding:
    10px
    18px;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

}


#emojiBtn{

    background:#2a3942;

    color:#e9edef;

}


#send{

    margin-left:auto;

    background:#00a884;

    color:#ffffff;

}


/* ==================================================
   HIDE OLD CHAT CONTAINER
================================================== */

.chat-messages{

    display:none;

}


/* ==================================================
   NOTIFICATION PANEL
================================================== */

.notificationPanel{

    display:none;

    position:absolute;

    right:10px;

    top:60px;

    width:280px;

    max-width:
    calc(100vw - 20px);

    max-height:350px;

    overflow-y:auto;

    z-index:1000;

    background:#202c33;

    border:
    1px solid #39464d;

    border-radius:10px;

    box-shadow:
    0 8px 30px
    rgba(0,0,0,.5);

}


.notificationPanel.active{

    display:block;

}


.notificationItem{

    padding:
    12px;

    border-bottom:
    1px solid #39464d;

    color:#e9edef;

    font-size:13px;

}


.notificationItem:last-child{

    border-bottom:0;

}


.notificationItem small{

    display:block;

    margin-top:4px;

    color:#8696a0;

}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:600px){

    #activeListenersCard{

        padding:
        12px
        14px;

    }


    #profileCard{

        padding:
        9px
        14px;

    }


    .profileImage{

        width:50px !important;

        height:50px !important;

        min-width:50px;

    }


    .chatTitle{

        padding:
        11px
        9px;

    }


    .chatTitle h2{

        font-size:18px;

    }


    .postButton{

        padding:
        7px
        10px;

        font-size:12px;

    }


    .notificationButton{

        width:36px;

        height:36px;

    }


    #messages{

        height:58vh;

        min-height:350px;

        padding:
        12px
        8px
        20px;

    }


    .communityMessage{

        max-width:92%;

    }


    .picturePost{

        width:94%;

    }


    .postImage{

        max-height:400px;

    }


    .chatBox{

        padding:7px;

    }


    .chatBox textarea{

        min-height:52px;

        font-size:16px;

    }

}


/* ==================================================
   VERY SMALL PHONES
================================================== */

@media(max-width:380px){

    .chatTitle h2{

        font-size:16px;

    }


    .postButton{

        padding:
        6px
        8px;

    }


    .communityMessage{

        max-width:94%;

    }

}

</style>

</head>


<body>

     ACTIVE LISTENERS
================================================== -->

id="activeListenersCard">

0 Listeners Online

<!-- ==================================================

================================================== -->

<section
id="profileCard">


<div
class="profileRow">

id="profilePreview"

alt="Profile Picture"
class="profileImage">


<div
class="profileDetails">


<input
type="text"
id="name"

id="welcomeName">

class="profileFile">

</div>


</div>

     COMMUNITY CHAT
================================================== -->

<section
class="chatCard">


<!-- CHAT HEADER -->

<div
class="chatTitle">


<h2>

</h2>


<button
class="postButton"
id="mainPostButton">

📷 Post

<button
class="notificationButton"
id="notificationButton"

<script
type="module"
src="js/chat.js?v=4">
</script>


<!-- ==================================================
     NOTIFICATION PANEL SCRIPT
================================================== -->

<script
type="module">

import {

    db,
    ref,
    onValue,
    update

} from "./js/firebase.js";


const listenerId =
    localStorage.getItem(
        "kulzzyListenerId"
    );


const notificationButton =
    document.getElementById(
        "notificationButton"
    );


const notificationPanel =
    document.getElementById(
        "notificationPanel"
    );


const badge =
    document.getElementById(
        "notificationBadge"
    );


if (
    listenerId &&
    notificationButton &&
    notificationPanel
) {


    notificationButton.addEventListener(
        "click",
        () => {

            notificationPanel.classList.toggle(
                "active"
            );

        }
    );


    onValue(

        ref(
            db,
            "notifications/" +
            listenerId
        ),

        (snapshot) => {


            const data =
                snapshot.val() || {};


            const items =
                Object.entries(data)
                    .filter(
                        ([key,value]) =>
                            value
                    )
                    .sort(
                        (a,b) =>
                            (b[1].time || 0) -
                            (a[1].time || 0)
                    );


            const unread =
                items.filter(
                    ([key,value]) =>
                        value.read === false
                ).length;


            badge.textContent =
                unread;


            badge.style.display =
                unread > 0
                ? "flex"
                : "none";


            if (
                items.length === 0
            ) {

                notificationPanel.innerHTML = `

                    <div
                    class="notificationItem">

                    🔔 No notifications yet.

                    </div>

                `;

                return;

            }


            notificationPanel.innerHTML =
                items.map(
                    ([key,item]) => {


                        let text =
                            "New activity";


                        if (
                            item.type ===
                            "follow"
                        ) {

                            text =
                            `👤 ${
                                item.fromName
                                || "Someone"
                            } followed you`;

                        }


                        if (
                            item.type ===
                            "like"
                        ) {

                            text =
                            `❤️ ${
                                item.fromName
                                || "Someone"
                            } liked your post`;

                        }


                        if (
                            item.type ===
                            "comment"
                        ) {

                            text =
                            `💬 ${
                                item.fromName
                                || "Someone"
                            } commented on your post`;

                        }


                        return `

                            <div
                            class="notificationItem"
                            data-key="${key}">

                            ${text}

                            <small>

                            ${
                                item.read
                                ? "Read"
                                : "New"

                            }

                            </small>

                            </div>

                        `;

                    }
                ).join("");


            /* MARK NOTIFICATIONS AS READ */

            items.forEach(
                ([key,item]) => {

                    if (
                        item.read === false
                    ) {

                        update(

                            ref(
                                db,
                                "notifications/" +
                                listenerId +
                                "/" +
                                key
                            ),

                            {
                                read:true
                            }

                        );

                    }

                }
            );

        }

    );

}

</script>
