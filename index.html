<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Kulzzy Radio | Community Chat
</title>

<meta
name="theme-color"
content="#0b141a">

<link
rel="stylesheet"
href="css/style.css">

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    background:#0b141a;
    color:#e9edef;
    font-family:Arial,Helvetica,sans-serif;
}


/* =====================================
   ACTIVE LISTENERS
===================================== */

#activeListenersCard{

    padding:14px 18px;

    background:#111b21;

    border-bottom:
    1px solid #26343b;

}

#activeListenersCard h2{

    margin:0 0 10px;

    font-size:18px;

    color:#e9edef;

}

#activeListeners{

    display:flex;

    align-items:center;

    gap:10px;

    color:#aebac1;

}

.listenerIcon{

    width:40px;

    height:40px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#202c33;

}


/* =====================================
   PROFILE
===================================== */

#profileCard{

    padding:10px 18px;

    background:#111b21;

    border-bottom:
    1px solid #26343b;

}

.profileRow{

    display:flex;

    align-items:center;

    gap:12px;

}

.profileImage{

    width:52px !important;

    height:52px !important;

    min-width:52px;

    border-radius:50% !important;

    object-fit:cover;

    border:2px solid #00a884 !important;

}

.profileDetails{

    flex:1;

}

.profileDetails input[type="text"]{

    width:100%;

    max-width:400px;

    padding:5px 0;

    border:0;

    border-bottom:
    1px solid #39464d;

    outline:none;

    background:transparent;

    color:#e9edef;

    font-size:16px;

}

.profileDetails h3{

    margin:4px 0;

    font-size:13px;

    color:#8696a0;

    font-weight:normal;

}

.profileFile input{

    color:#8696a0;

    font-size:11px;

}


/* =====================================
   COMMUNITY CHAT
===================================== */

.chatCard{

    width:100%;

    background:#0b141a;

}


/* CHAT HEADER */

.chatTitle{

    padding:15px 18px;

    background:#202c33;

    border-bottom:
    1px solid #39464d;

}

.chatTitle h2{

    margin:0;

    font-size:20px;

    color:#e9edef;

}


/* =====================================
   MESSAGE AREA
===================================== */

.messages{

    height:58vh;

    min-height:400px;

    overflow-y:auto;

    padding:15px 10px 25px;

    background:#0b141a;

}


/* SYSTEM */

.systemMessage{

    width:fit-content;

    max-width:90%;

    margin:8px auto 18px;

    padding:9px 13px;

    background:#182229;

    border-radius:8px;

    color:#8696a0;

    text-align:center;

    font-size:13px;

    line-height:1.5;

}


/* =====================================
   TEXT MESSAGE
===================================== */

.communityMessage{

    width:fit-content;

    max-width:88%;

    margin:7px 0;

    padding:8px 10px;

    background:#202c33;

    border-radius:
    8px 8px 8px 2px;

    box-shadow:
    0 1px 2px rgba(0,0,0,.25);

}

.messageName{

    color:#00a884;

    font-size:13px;

    font-weight:bold;

    margin-bottom:3px;

}

.messageText{

    color:#e9edef;

    font-size:15px;

    line-height:1.45;

    word-break:break-word;

}


/* =====================================
   LISTENER ACTIONS
===================================== */

.listenerActions{

    display:flex;

    align-items:center;

    gap:5px;

    margin-top:7px;

    padding-top:5px;

    border-top:
    1px solid rgba(255,255,255,.06);

}

.listenerActions button{

    border:0;

    border-radius:15px;

    padding:5px 9px;

    background:#2a3942;

    color:#d9e1e5;

    font-size:11px;

    cursor:pointer;

}

.listenerActions button:hover{

    background:#394b55;

}

.listenerActions .following{

    background:#00a884;

    color:#ffffff;

}

.viewCounter{

    color:#8696a0;

    font-size:11px;

    margin-left:2px;

}


/* =====================================
   PICTURE POST
===================================== */

.picturePost{

    width:90%;

    max-width:430px;

    margin:14px 0;

    padding:8px;

    background:#202c33;

    border-radius:10px;

}


/* POST HEADER */

.postHeader{

    display:flex;

    align-items:center;

    gap:10px;

    padding:4px 5px 9px;

}

.postAvatar{

    width:38px;

    height:38px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#2a3942;

}

.postHeader strong{

    display:block;

    color:#e9edef;

    font-size:14px;

}

.postHeader small{

    display:block;

    color:#8696a0;

    font-size:11px;

    margin-top:2px;

}


/* POST IMAGE */

.postImage{

    display:block;

    width:100%;

    max-height:430px;

    object-fit:cover;

    border-radius:7px;

    cursor:pointer;

}


/* POST FOOTER */

.postFooter{

    display:flex;

    align-items:center;

    gap:12px;

    padding:8px 3px 2px;

}

.postFooter button{

    border:0;

    border-radius:16px;

    padding:7px 12px;

    background:#2a3942;

    color:#e9edef;

    font-size:12px;

}

.postFooter button:hover{

    background:#394b55;

}

.postViews{

    color:#8696a0;

    font-size:12px;

}


/* =====================================
   CHAT BOX
===================================== */

.chatBox{

    padding:8px;

    background:#202c33;

    border-top:
    1px solid #26343b;

}

.chatBox textarea{

    display:block;

    width:100%;

    min-height:54px;

    max-height:130px;

    resize:none;

    border:0;

    outline:none;

    border-radius:25px;

    padding:15px 18px;

    background:#2a3942;

    color:#e9edef;

    font-size:16px;

}

.chatBox textarea::placeholder{

    color:#8696a0;

}


/* BUTTONS */

.chatActions{

    display:flex;

    gap:8px;

    margin-top:8px;

}

.chatActions button{

    border:0;

    border-radius:20px;

    padding:10px 18px;

    font-weight:bold;

    cursor:pointer;

}

#emojiBtn{

    background:#2a3942;

    color:#e9edef;

}

#send{

    margin-left:auto;

    background:#00a884;

    color:#ffffff;

}


/* HIDE OLD EXTRA CHAT */

.chat-messages{

    display:none;

}


/* =====================================
   MOBILE
===================================== */

@media(max-width:600px){

    #activeListenersCard{

        padding:
        12px 14px;

    }

    #profileCard{

        padding:
        9px 14px;

    }

    .profileImage{

        width:50px !important;

        height:50px !important;

        min-width:50px;

    }

    .messages{

        height:58vh;

        min-height:350px;

        padding:
        12px 8px 20px;

    }

    .communityMessage{

        max-width:92%;

    }

    .picturePost{

        width:94%;

    }

    .postImage{

        max-height:400px;

    }

}

</style>

</head>


<body>


<!-- =====================================
     ACTIVE LISTENERS
===================================== -->

<section
id="activeListenersCard">

<h2>
👥 Active Listeners
</h2>

<div id="activeListeners">

<div class="listenerIcon">
👥
</div>

<span>
0 Listeners Online
</span>

</div>

</section>


<!-- =====================================
     PROFILE
===================================== -->

<section
id="profileCard">

<div class="profileRow">

<img
id="profilePreview"
src="assets/images/default-avatar.png"
alt="Profile Picture"
class="profileImage">


<div class="profileDetails">

<input
type="text"
id="name"
placeholder="Enter your display name">


<h3 id="welcomeName">
Welcome!
</h3>


<div class="profileFile">

<input
type="file"
id="profileImage"
accept="image/*">

</div>

</div>

</div>

</section>


<!-- =====================================
     COMMUNITY CHAT
     EVERYTHING IS INSIDE HERE
===================================== -->

<section
class="chatCard">


<div class="chatTitle">

<h2>
💬 Community Chat
</h2>

</div>


<div
id="messages"
class="messages">


<p class="systemMessage">

Welcome to Kulzzy Radio Live Community.
<br>

Start chatting with listeners around the world.

</p>


</div>


<div class="chatBox">


<textarea
id="message"
placeholder="Type a message..."></textarea>


<div class="chatActions">


<button
id="emojiBtn">

😊 Emoji

</button>


<button
id="send">

📤 Send

</button>


</div>


<div
id="chatMessages"
class="chat-messages">
</div>


</div>


</section>


<!-- =====================================
     SCRIPTS
===================================== -->

<script
type="module"
src="js/firebase.js?v=4">
</script>


<script
type="module"
src="js/app.js?v=4">
</script>


<script
type="module"
src="js/chat.js?v=4">
</script>


</body>

</html>
