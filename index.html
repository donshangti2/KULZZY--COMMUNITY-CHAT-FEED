<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Kulzzy Radio Community</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#001b2b;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}
.app{width:100%;max-width:760px;margin:auto;min-height:100vh;background:#001b2b;padding-bottom:145px}

/* INTRO */
.intro{margin:0 18px 18px;padding:18px 16px;background:#001b2b;text-align:center;color:#e9f2f6;font-size:16px;line-height:1.45}
.intro strong{color:#ffd000;font-size:17px;font-weight:700}

/* PROFILE */
.profile-area{margin:0 18px 18px;padding:18px;background:#062d3e;border:1px solid #075a78;border-radius:22px}
.profile-row{display:flex;align-items:center;gap:14px}
.profile-picture{width:72px;height:72px;min-width:72px;border-radius:50%;object-fit:cover;border:3px solid #ffd000;background:#092331}
.profile-details{flex:1;min-width:0}
.name-input{width:100%;height:46px;border:0;outline:0;border-radius:14px;padding:0 13px;font-size:17px;background:#fff;color:#111}
.profile-controls{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.profile-file{flex:1;min-width:130px;color:#fff;font-size:12px}
.save-profile,.cancel-profile{border-radius:13px;padding:9px 13px;font-weight:bold;cursor:pointer}
.save-profile{border:2px solid #ffd000;background:#ffd000;color:#001b2b}
.cancel-profile{border:1px solid #ffd000;background:transparent;color:#ffd000;display:none}
.profile-saved-view{display:none;text-align:center}
.profile-saved-view.show{display:block}
.saved-profile-picture{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #ffd000;background:#092331}
.saved-profile-name{margin-top:8px;color:#ffd000;font-size:17px;font-weight:bold;word-break:break-word}
.edit-profile-btn{margin-top:10px;border:1px solid #ffd000;background:#062d3e;color:#ffd000;border-radius:17px;padding:8px 14px;font-weight:bold;font-size:13px;cursor:pointer}

/* FEED */
.feed{width:100%;padding:0 12px}
.post{background:#062d3e;border:1px solid #075a78;border-radius:22px;overflow:hidden;margin:0 0 18px}
.post-header{display:flex;align-items:center;gap:10px;padding:12px 14px}
.post-avatar{width:52px;height:52px;min-width:52px;border-radius:50%;object-fit:cover;border:2px solid #ffd000;background:#092331}
.post-user{flex:1;min-width:0}
.post-name{color:#ffd000;font-size:16px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post-time{color:#9db0ba;font-size:12px;margin-top:3px}
.follow-wrap{display:flex;align-items:center;gap:6px}
.follow-btn{border:1px solid #ffd000;color:#ffd000;background:transparent;border-radius:18px;padding:7px 11px;font-size:12px;font-weight:bold;white-space:nowrap}
.follow-btn.following{background:#ffd000;color:#001b2b}
.follow-count{color:#d7e2e7;font-size:12px;white-space:nowrap}
.post-image-wrap{width:100%;background:#00131e;cursor:pointer}
.post-image{width:100%;height:auto;max-height:720px;display:block;object-fit:contain}
.post-actions{display:flex;align-items:center;padding:9px 12px;gap:7px;border-top:1px solid #075a78}
.action-btn{border:0;background:#073b50;color:#fff;border-radius:11px;padding:7px 10px;font-size:14px;cursor:pointer}
.action-btn.liked{color:#ff3b3b}
.click-count{margin-left:auto;color:#d7e2e7;font-size:14px}
.comments{padding:0 12px 12px}
.comment{background:#082431;border-radius:11px;padding:8px 9px;margin-top:7px}
.comment-name{color:#ffd000;font-weight:bold;font-size:12px}
.comment-text{color:#fff;margin-top:3px;font-size:13px;line-height:1.35}
.comment-box{display:flex;gap:7px;margin-top:8px}
.comment-input{flex:1;min-width:0;height:39px;border:0;outline:0;border-radius:11px;padding:0 11px;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;font-size:14px}
.comment-send{border:0;border-radius:11px;background:#ffd000;color:#001b2b;font-weight:bold;padding:0 12px;font-size:13px}
.empty{text-align:center;padding:40px 15px;color:#8fa7b2;font-size:14px}

/* COMPOSER */
.composer{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:760px;background:#062d3e;border-top:1px solid #075a78;padding:9px 12px 11px;z-index:3000}
.composer-row{display:flex;align-items:flex-end;gap:7px}
.composer-btn{width:54px;height:54px;min-width:54px;border:0;border-radius:50%;background:#ffd000;color:#001b2b;display:flex;align-items:center;justify-content:center;font-size:23px;cursor:pointer}
.message-box{flex:1;min-width:0;max-height:130px;min-height:54px;resize:none;overflow-y:auto;border:0;outline:0;border-radius:27px;padding:15px 17px;font-size:17px;line-height:1.35;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
.hidden-input{display:none}

/* NOTIFICATIONS */
.notification-panel{position:fixed;top:15px;right:15px;width:min(340px,calc(100% - 30px));background:#062d3e;border:1px solid #ffd000;border-radius:18px;z-index:5000;box-shadow:0 10px 40px rgba(0,0,0,.45);display:none;overflow:hidden}
.notification-panel.show{display:block}
.notification-title{padding:13px;background:#001b2b;color:#ffd000;font-weight:bold;border-bottom:1px solid #075a78}
.notification-list{max-height:300px;overflow:auto}
.notification-item{padding:11px;border-bottom:1px solid #075a78;font-size:13px}

/* VIEWER */
.image-viewer{position:fixed;inset:0;background:rgba(0,8,14,.94);z-index:9000;display:none;align-items:center;justify-content:center;padding:25px 15px}
.image-viewer.show{display:flex}
.viewer-content{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.viewer-image{max-width:96%;max-height:90%;object-fit:contain;border-radius:10px}
.viewer-close{position:absolute;top:12px;right:12px;width:48px;height:48px;border:0;border-radius:50%;background:#ffd000;color:#001b2b;font-size:30px;font-weight:bold}
.viewer-click-count{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#062d3e;border:1px solid #ffd000;color:#ffd000;padding:8px 14px;border-radius:20px;font-size:13px}
.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:#ffd000;color:#001b2b;padding:10px 16px;border-radius:20px;font-weight:bold;z-index:10000;display:none;max-width:90%;text-align:center;font-size:14px}
.toast.show{display:block}

@media(max-width:500px){
 .intro{font-size:15px}.intro strong{font-size:16px}
 .profile-picture{width:68px;height:68px;min-width:68px}
 .name-input{font-size:16px}
 .post-header{padding:11px}
 .post-avatar{width:50px;height:50px;min-width:50px}
 .post-name{font-size:15px}
 .follow-btn{padding:6px 9px;font-size:11px}
 .follow-count{font-size:11px}
 .composer-btn{width:51px;height:51px;min-width:51px}
 .message-box{font-size:16px;min-height:51px}
}
</style>
</head>
<body>

<div class="app">

<div class="intro">
<strong>CELEBRATE, SELL &amp; NETWORK</strong><br>
with listeners around the world.
</div>

<section id="profileArea" class="profile-area">

<div id="profileEditor">
<div class="profile-row">
<img id="profilePicture" class="profile-picture" src="" alt="Profile">
<div class="profile-details">
<input id="nameInput" class="name-input" type="text" maxlength="40" placeholder="Your name">
<div class="profile-controls">
<input id="profileFile" class="profile-file" type="file" accept="image/*">
<button id="saveProfile" class="save-profile">Save</button>
<button id="cancelProfile" class="cancel-profile">Cancel</button>
</div>
</div>
</div>
</div>

<div id="savedProfileView" class="profile-saved-view">
<img id="savedProfilePicture" class="saved-profile-picture" src="" alt="Profile">
<div id="savedProfileName" class="saved-profile-name"></div>
<button id="editProfileBtn" class="edit-profile-btn">✏️ Edit Profile</button>
</div>

</section>

<main id="feed" class="feed">
<div class="empty" id="emptyFeed">No community posts yet.</div>
</main>
</div>

<div class="composer">
<div class="composer-row">
<button id="cameraBtn" class="composer-btn">📷</button>
<input id="cameraInput" class="hidden-input" type="file" accept="image/*" capture="environment">

<textarea id="messageBox" class="message-box" rows="1" maxlength="1000" placeholder="Type a message..."></textarea>

<button id="uploadBtn" class="composer-btn">🖼️</button>
<input id="uploadInput" class="hidden-input" type="file" accept="image/*">

<button id="sendBtn" class="composer-btn">➤</button>
</div>
</div>

<div id="notificationPanel" class="notification-panel">
<div class="notification-title">🔔 Notifications</div>
<div id="notificationList" class="notification-list"></div>
</div>

<div id="imageViewer" class="image-viewer">
<div class="viewer-content">
<button id="viewerClose" class="viewer-close">×</button>
<img id="viewerImage" class="viewer-image" src="" alt="Community post">
<div id="viewerClickCount" class="viewer-click-count">👆 0</div>
</div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,push,set,get,update,onValue,runTransaction}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import{getAuth,onAuthStateChanged,signInAnonymously}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyBH85NGWsSAK5cubbPdnmunwYZFZpj_CB0",
 authDomain:"kulzzy-radio-chat.firebaseapp.com",
 databaseURL:"https://kulzzy-radio-chat-default-rtdb.europe-west1.firebasedatabase.app",
 projectId:"kulzzy-radio-chat",
 storageBucket:"kulzzy-radio-chat.firebasestorage.app",
 messagingSenderId:"510100635134",
 appId:"1:510100635134:web:9d3b2e983eb6e9a385d4af"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const auth=getAuth(app);

const CLOUDINARY_CLOUD_NAME="s4j0x7dk";
const CLOUDINARY_UPLOAD_PRESET="Community Chat";

const $=id=>document.getElementById(id);
const feed=$("feed"),emptyFeed=$("emptyFeed"),profileArea=$("profileArea");
const profileEditor=$("profileEditor"),savedProfileView=$("savedProfileView");
const editBtn=$("editProfileBtn"),cancelBtn=$("cancelProfile");
const profilePicture=$("profilePicture"),nameInput=$("nameInput"),profileFile=$("profileFile");
const savedProfilePicture=$("savedProfilePicture"),savedProfileName=$("savedProfileName");
const saveBtn=$("saveProfile"),messageBox=$("messageBox"),toast=$("toast");
const imageViewer=$("imageViewer"),viewerImage=$("viewerImage"),viewerClose=$("viewerClose"),viewerClickCount=$("viewerClickCount");
const notificationList=$("notificationList");

const DEFAULT_PROFILE="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(
`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
<rect width="200" height="200" fill="#092331"/>
<circle cx="100" cy="75" r="38" fill="#ffd000"/>
<path d="M35 180C45 125 155 125 165 180" fill="#ffd000"/>
</svg>`);

profilePicture.src=DEFAULT_PROFILE;

let toastTimer;
function showToast(t){
 toast.textContent=t;
 toast.classList.add("show");
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>toast.classList.remove("show"),2500);
}

/* AUTHENTICATION
   The site uses Firebase Authentication so one authenticated
   account has one stable UID. Email/password registration/login
   should be enabled in Firebase Console. */
let firebaseUser=null;

async function ensureAuthentication(){
 return new Promise(async(resolve)=>{
  onAuthStateChanged(auth,user=>{
   if(user){
    firebaseUser=user;
    resolve(user);
   }
  });
  try{
   await signInAnonymously(auth);
  }catch(e){
   console.error("Authentication:",e);
   showToast("Please enable Anonymous Authentication in Firebase.");
   resolve(null);
  }
 });
}

/* Stable UID: Firebase UID is preferred. */
let userId=localStorage.getItem("kulzzyCommunityUserId")||"";

function setStableUserId(uid){
 userId=uid;
 localStorage.setItem("kulzzyCommunityUserId",uid);
}

/* PROFILE */
let savedProfile=JSON.parse(localStorage.getItem("kulzzyCommunityProfile")||"null");

function displayProfilePhoto(url){
 const safeUrl=url||DEFAULT_PROFILE;
 const displayUrl=safeUrl.startsWith("http") ? safeUrl + (safeUrl.includes("?")?"&":"?") + "profileVersion=" + Date.now() : safeUrl;
 profilePicture.src=displayUrl;
 savedProfilePicture.src=displayUrl;
}

function showSavedProfile(){
 if(savedProfile&&savedProfile.name&&savedProfile.photo){
  profileEditor.style.display="none";
  savedProfileView.classList.add("show");
  savedProfileName.textContent=savedProfile.name;
  displayProfilePhoto(savedProfile.photo);
  profileFile.value="";
 }
}

function openEditor(){
 profileEditor.style.display="block";
 savedProfileView.classList.remove("show");
 cancelBtn.style.display=savedProfile?"block":"none";
 if(savedProfile){
  nameInput.value=savedProfile.name||"";
  displayProfilePhoto(savedProfile.photo||DEFAULT_PROFILE);
 }
 nameInput.focus();
}

function closeEditor(){
 if(savedProfile&&savedProfile.name&&savedProfile.photo){
  nameInput.value=savedProfile.name;
  displayProfilePhoto(savedProfile.photo);
  showSavedProfile();
 }else{
  profileEditor.style.display="block";
  savedProfileView.classList.remove("show");
 }
}

if(savedProfile&&savedProfile.name&&savedProfile.photo)closeEditor();
else openEditor();

editBtn.onclick=openEditor;
cancelBtn.onclick=closeEditor;

async function uploadToCloudinary(file){
 const fd=new FormData();
 fd.append("file",file);
 fd.append("upload_preset",CLOUDINARY_UPLOAD_PRESET);
 const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,{method:"POST",body:fd});
 const d=await r.json();
 if(!r.ok||!d.secure_url)throw Error(d.error?.message||"Cloudinary upload failed.");
 return d.secure_url;
}

async function migrateOldLocalProfile(){
 if(!userId||!savedProfile)return;
 try{
  const pRef=ref(db,"profiles/"+userId);
  const snap=await get(pRef);
  if(!snap.exists()){
   await set(pRef,{...savedProfile,uid:userId});
  }
 }catch(e){console.error(e)}
}

async function saveProfileToDatabase(profile){
 await set(ref(db,"profiles/"+userId),{...profile,uid:userId});
 const snap=await get(ref(db,"communityPosts"));
 if(snap.exists()){
  const changes={};
  snap.forEach(c=>{
   if(c.val().uid===userId){
    changes[`communityPosts/${c.key}/name`]=profile.name;
    changes[`communityPosts/${c.key}/avatar`]=profile.photo;
   }
  });
  if(Object.keys(changes).length)await update(ref(db),changes);
 }
}

saveBtn.onclick=async()=>{
 const name=nameInput.value.trim();
 const file=profileFile.files[0];

 if(!name)return showToast("Please write your name.");
 if(!file&&!savedProfile?.photo)return showToast("Please upload your profile picture.");

 saveBtn.disabled=true;
 saveBtn.textContent="Saving...";

 try{
  let photo=savedProfile?.photo||"";
  if(file)photo=await uploadToCloudinary(file);

  savedProfile={name,photo,updatedAt:Date.now()};
  localStorage.setItem("kulzzyCommunityProfile",JSON.stringify(savedProfile));

  if(userId)await saveProfileToDatabase(savedProfile);

  displayProfilePhoto(photo);
  closeEditor();
  showToast("Profile saved successfully.");
 }catch(e){
  console.error(e);
  showToast(e.message||"Unable to save profile.");
 }finally{
  saveBtn.disabled=false;
  saveBtn.textContent="Save";
 }
};

function hasProfile(){
 return!!(savedProfile?.name&&savedProfile?.photo&&savedProfile.photo!==DEFAULT_PROFILE);
}

function resize(){
 messageBox.style.height="auto";
 messageBox.style.height=Math.min(messageBox.scrollHeight,130)+"px";
}
messageBox.addEventListener("input",resize);

$("cameraBtn").onclick=()=>$("cameraInput").click();
$("uploadBtn").onclick=()=>$("uploadInput").click();

async function sendMessage(){
 if(!hasProfile()){
  showToast("Save your name and profile picture first.");
  openEditor();
  return;
 }
 if(!userId)return;

 const text=messageBox.value.trim();
 if(!text)return;

 await set(push(ref(db,"chat")),{
  name:savedProfile.name,
  text,
  photo:savedProfile.photo,
  uid:userId,
  time:Date.now()
 });

 messageBox.value="";
 resize();
}

$("sendBtn").onclick=sendMessage;
messageBox.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});

async function createPost(file){
 if(!hasProfile()){
  showToast("Save your name and profile picture first.");
  openEditor();
  return;
 }
 if(!file||!file.type.startsWith("image/"))return showToast("Only pictures are allowed.");

 showToast("Uploading picture...");

 try{
  const image=await uploadToCloudinary(file);
  const post={
   uid:userId,
   name:savedProfile.name,
   avatar:savedProfile.photo,
   image,
   likes:0,
   clicks:0,
   time:Date.now()
  };

  await set(push(ref(db,"communityPosts")),post);

  await set(push(ref(db,"notifications")),{
   type:"post",
   uid:userId,
   name:savedProfile.name,
   text:savedProfile.name+" posted a picture.",
   time:Date.now()
  });

  showToast("Picture posted.");
 }catch(e){
  console.error(e);
  showToast(e.message||"Unable to upload picture.");
 }
}

$("uploadInput").onchange=async e=>{
 if(e.target.files[0])await createPost(e.target.files[0]);
 e.target.value="";
};

$("cameraInput").onchange=async e=>{
 if(e.target.files[0])await createPost(e.target.files[0]);
 e.target.value="";
};

function esc(v){
 return String(v||"")
 .replaceAll("&","&amp;").replaceAll("<","&lt;")
 .replaceAll(">","&gt;").replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function time(t){
 return t?new Date(t).toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"";
}

/* FOLLOW + COUNT */
async function getFollowerCount(owner){
 const snap=await get(ref(db,`followers/${owner}`));
 return snap.exists()?Object.keys(snap.val()).length:0;
}

async function follow(owner,btn,countEl){
 if(owner===userId)return showToast("You cannot follow yourself.");
 if(!userId)return;

 const r=ref(db,`followers/${owner}/${userId}`);
 const s=await get(r);

 if(s.exists()){
  await set(r,null);
  btn.textContent="Follow Me";
  btn.classList.remove("following");
 }else{
  await set(r,{
   uid:userId,
   name:savedProfile?.name||"Listener",
   time:Date.now()
  });

  btn.textContent="Following";
  btn.classList.add("following");

  await set(push(ref(db,"notifications")),{
   type:"follow",
   uid:owner,
   fromUid:userId,
   name:savedProfile?.name||"Listener",
   text:(savedProfile?.name||"Someone")+" followed you.",
   time:Date.now()
  });
 }

 countEl.textContent=await getFollowerCount(owner);
}

async function setFollow(owner,btn,countEl){
 if(owner===userId){
  btn.style.display="none";
  countEl.style.display="none";
  return;
 }

 const s=await get(ref(db,`followers/${owner}/${userId}`));
 if(s.exists()){
  btn.textContent="Following";
  btn.classList.add("following");
 }
 countEl.textContent=await getFollowerCount(owner);
}

/* LIKE */
async function like(id,btn,count){
 const lr=ref(db,`postLikes/${id}/${userId}`);
 const s=await get(lr);
 const cr=ref(db,`communityPosts/${id}/likes`);

 if(s.exists()){
  await set(lr,null);
  await runTransaction(cr,n=>Math.max(0,Number(n||0)-1));
  btn.classList.remove("liked");
 }else{
  await set(lr,true);
  await runTransaction(cr,n=>Number(n||0)+1);
  btn.classList.add("liked");
 }

 count.textContent=(await get(cr)).val()||0;
}

/* CLICK */
async function clickPost(id,url){
 viewerImage.src=url;
 imageViewer.classList.add("show");

 const key="kulzzy_clicked_"+id;

 if(!localStorage.getItem(key)){
  localStorage.setItem(key,"1");
  const r=ref(db,`communityPosts/${id}/clicks`);
  await runTransaction(r,n=>Number(n||0)+1);
  viewerClickCount.textContent="👆 "+((await get(r)).val()||0);
 }else{
  const s=await get(ref(db,`communityPosts/${id}/clicks`));
  viewerClickCount.textContent="👆 "+(s.val()||0);
 }
}

viewerClose.onclick=()=>{
 imageViewer.classList.remove("show");
 viewerImage.src="";
};

imageViewer.onclick=e=>{
 if(e.target===imageViewer){
  imageViewer.classList.remove("show");
  viewerImage.src="";
 }
};

/* COMMENTS */
async function comment(id,input){
 if(!hasProfile()){
  showToast("Save your profile first.");
  openEditor();
  return;
 }

 const text=input.value.trim();
 if(!text)return;

 await set(push(ref(db,`comments/${id}`)),{
  uid:userId,
  name:savedProfile.name,
  text,
  time:Date.now()
 });

 input.value="";
}

function comments(id,box){
 onValue(ref(db,`comments/${id}`),s=>{
  box.innerHTML="";
  if(!s.exists())return;

  s.forEach(c=>{
   const d=c.val();
   const x=document.createElement("div");
   x.className="comment";
   x.innerHTML=`<div class="comment-name">${esc(d.name)}</div>
   <div class="comment-text">${esc(d.text)}</div>`;
   box.appendChild(x);
  });
 });
}

/* POSTS */
function render(s){
 feed.innerHTML="";

 if(!s.exists()){
  feed.appendChild(emptyFeed);
  return;
 }

 const posts=[];
 s.forEach(c=>posts.push({id:c.key,...c.val()}));
 posts.sort((a,b)=>(b.time||0)-(a.time||0));

 posts.forEach(p=>{
  const a=document.createElement("article");
  a.className="post";

  a.innerHTML=`
  <div class="post-header">
   <img class="post-avatar" src="${esc(p.avatar||DEFAULT_PROFILE)}">
   <div class="post-user">
    <div class="post-name">${esc(p.name||"Listener")}</div>
    <div class="post-time">${time(p.time)}</div>
   </div>
   <div class="follow-wrap">
    <button class="follow-btn">Follow Me</button>
    <span class="follow-count">0 followers</span>
   </div>
  </div>

  <div class="post-image-wrap">
   <img class="post-image" src="${esc(p.image)}">
  </div>

  <div class="post-actions">
   <button class="action-btn like-btn">❤️ <span class="like-count">${p.likes||0}</span></button>
   <button class="action-btn">💬 Comment</button>
   <div class="click-count">👆 <span>${p.clicks||0}</span></div>
  </div>

  <div class="comments">
   <div class="comment-list"></div>
   <div class="comment-box">
    <input class="comment-input" maxlength="300" placeholder="Comment...">
    <button class="comment-send">Send</button>
   </div>
  </div>`;

  const fb=a.querySelector(".follow-btn");
  const fc=a.querySelector(".follow-count");
  const img=a.querySelector(".post-image");
  const lb=a.querySelector(".like-btn");
  const lc=a.querySelector(".like-count");
  const ci=a.querySelector(".comment-input");
  const cs=a.querySelector(".comment-send");

  fb.onclick=()=>follow(p.uid,fb,fc);
  setFollow(p.uid,fb,fc);

  img.onclick=()=>clickPost(p.id,p.image);

  lb.onclick=()=>like(p.id,lb,lc);

  cs.onclick=()=>comment(p.id,ci);
  ci.onkeydown=e=>{
   if(e.key==="Enter"){
    e.preventDefault();
    comment(p.id,ci);
   }
  };

  comments(p.id,a.querySelector(".comment-list"));
  feed.appendChild(a);
 });
}

onValue(ref(db,"communityPosts"),render);

/* NOTIFICATIONS */
onValue(ref(db,"notifications"),s=>{
 notificationList.innerHTML="";

 if(!s.exists()){
  notificationList.innerHTML="<div class='notification-item'>No notifications.</div>";
  return;
 }

 const a=[];
 s.forEach(c=>a.push(c.val()));

 a.sort((x,y)=>(y.time||0)-(x.time||0))
 .slice(0,30)
 .forEach(n=>{
  const d=document.createElement("div");
  d.className="notification-item";
  d.textContent=n.text||"New activity.";
  notificationList.appendChild(d);
 });
});

/* START */
ensureAuthentication().then(async user=>{
 if(user){
  setStableUserId(user.uid);
  await migrateOldLocalProfile();

  /* Load profile from Firebase if this device does not have it locally. */
  try{
   const snap=await get(ref(db,"profiles/"+userId));
   if(snap.exists()){
    const p=snap.val();
    savedProfile={name:p.name||"",photo:p.photo||"",updatedAt:p.updatedAt||Date.now()};
    localStorage.setItem("kulzzyCommunityProfile",JSON.stringify(savedProfile));
    if(savedProfile.name&&savedProfile.photo)closeEditor();
   }
  }catch(e){console.error(e)}
 }
});
