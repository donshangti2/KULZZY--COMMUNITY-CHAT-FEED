<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Kulzzy Radio Community</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#001b2b;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

.app{
    width:100%;
    max-width:760px;
    margin:auto;
    min-height:100vh;
    background:#001b2b;
    padding-bottom:145px;
}


.auth-gate{
    position:fixed;inset:0;background:rgba(0,8,14,.96);z-index:20000;display:flex;align-items:center;justify-content:center;padding:20px;
}
.auth-card{width:100%;max-width:430px;background:#062d3e;border:1px solid #075a78;border-radius:22px;padding:24px;box-shadow:0 15px 50px rgba(0,0,0,.5);text-align:center}
.auth-card h2{margin:0 0 8px;color:#ffd000;font-size:21px}
.auth-subtitle{margin:0 0 18px;color:#d7e2e7;font-size:14px;line-height:1.4}
.auth-input{width:100%;height:48px;border:0;outline:0;border-radius:13px;padding:0 13px;margin-top:10px;background:#fff;color:#111;font-size:15px}
.auth-error{min-height:22px;margin-top:9px;color:#ff8b8b;font-size:13px;line-height:1.3}
.auth-submit{width:100%;height:48px;border:0;border-radius:13px;background:#ffd000;color:#001b2b;font-weight:bold;font-size:15px;cursor:pointer}
.auth-submit:disabled{opacity:.65;cursor:wait}
.auth-switch{margin-top:11px;border:0;background:transparent;color:#ffd000;font-size:13px;cursor:pointer}

/* =========================
   INTRO
========================= */

.intro{
    margin:0 18px 18px;
    padding:18px 16px;
    background:#001b2b;
    text-align:center;
    color:#e9f2f6;
    font-size:16px;
    line-height:1.45;
}

.intro strong{
    color:#ffd000;
    font-size:16px;
    font-weight:700;
}

/* =========================
   PROFILE
========================= */

.profile-area{
    margin:0 18px 18px;
    padding:18px;
    background:#062d3e;
    border:1px solid #075a78;
    border-radius:22px;
}
/* COVER PICTURE */
.cover-area{
    width:100%;
    margin-bottom:16px;
}

.cover-preview{
    width:100%;
    height:150px;
    border-radius:16px;
    overflow:hidden;
    background:#092331;
    border:1px solid #075a78;
    position:relative;
}

.cover-preview img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

.cover-placeholder{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#8fa7b2;
    font-size:14px;
    text-align:center;
}

.cover-controls{
    margin-top:9px;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}

.cover-upload-btn{
    flex:1;
    min-width:150px;
    border:1px solid #ffd000;
    background:#ffd000;
    color:#001b2b;
    border-radius:13px;
    padding:9px 12px;
    font-weight:bold;
    font-size:13px;
    cursor:pointer;
}

.cover-edit-btn{
    border:1px solid #ffd000;
    background:transparent;
    color:#ffd000;
    border-radius:13px;
    padding:9px 12px;
    font-weight:bold;
    font-size:13px;
    cursor:pointer;
}

.cover-status{
    width:100%;
    color:#9db0ba;
    font-size:12px;
    text-align:center;
    margin-top:3px;
}

.hidden-cover-input{
    display:none;
}
    
.profile-row{
    display:flex;
    align-items:center;
    gap:14px;
}

.profile-picture{
    width:72px;
    height:72px;
    min-width:72px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #ffd000;
    background:#092331;
}

.profile-details{
    flex:1;
    min-width:0;
}

.name-input{
    width:100%;
    height:46px;
    border:0;
    outline:0;
    border-radius:14px;
    padding:0 13px;
    font-size:17px;
    background:#fff;
    color:#111;
}

.profile-controls{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:9px;
    flex-wrap:wrap;
}

.profile-file{
    flex:1;
    min-width:130px;
    color:#fff;
    font-size:12px;
}

.save-profile,
.cancel-profile{
    border-radius:13px;
    padding:9px 13px;
    font-weight:bold;
    cursor:pointer;
}

.save-profile{
    border:2px solid #ffd000;
    background:#ffd000;
    color:#001b2b;
}

.cancel-profile{
    border:1px solid #ffd000;
    background:transparent;
    color:#ffd000;
    display:none;
}

/* COVER */

.cover-upload-area{
    margin-top:14px;
    padding:12px;
    background:#07384b;
    border:1px dashed #ffd000;
    border-radius:15px;
}

.cover-upload-title{
    color:#ffd000;
    font-size:14px;
    font-weight:bold;
    margin-bottom:8px;
}

.cover-file{
    width:100%;
    color:#fff;
    font-size:12px;
}

.cover-preview{
    width:100%;
    height:130px;
    object-fit:cover;
    border-radius:14px;
    border:2px solid #ffd000;
    margin-top:10px;
    display:none;
}

.saved-cover{
    width:100%;
    height:130px;
    object-fit:cover;
    border-radius:14px;
    border:2px solid #ffd000;
    margin-bottom:12px;
    display:none;
}

/* SAVED PROFILE */

.profile-saved-view{
    display:none;
    text-align:center;
}
.profile-cover{
    width:100%;
    height:150px;
    border-radius:18px;
    overflow:hidden;
    background:#092331;
    border:1px solid #075a78;
    margin-bottom:15px;
    position:relative;
}

.profile-cover img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.cover-upload-box{
    margin-bottom:15px;
    padding:12px;
    border:1px dashed #ffd000;
    border-radius:14px;
    text-align:center;
    color:#ffd000;
    font-size:13px;
}

.cover-upload-box input{
    width:100%;
    margin-top:8px;
    color:#fff;
}

.edit-cover-btn{
    margin-top:8px;
    border:1px solid #ffd000;
    background:#062d3e;
    color:#ffd000;
    border-radius:14px;
    padding:7px 12px;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
}
.profile-saved-view.show{
    display:block;
}

.saved-profile-picture{
    width:72px;
    height:72px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #ffd000;
    background:#092331;
}

.saved-profile-name{
    margin-top:8px;
    color:#ffd000;
    font-size:17px;
    font-weight:bold;
    word-break:break-word;
}

.edit-profile-btn{
    margin-top:10px;
    border:1px solid #ffd000;
    background:#062d3e;
    color:#ffd000;
    border-radius:17px;
    padding:8px 14px;
    font-weight:bold;
    font-size:13px;
    cursor:pointer;
}


/* =========================
   PROFILE BRAND DISPLAY
========================= */

.profile-brand-stage{
    width:100%;
    height:230px;
    position:relative;
    overflow:hidden;
    border-radius:18px;
    border:1px solid #075a78;
    background:#fff center center / contain no-repeat;
    margin-bottom:12px;
}

.profile-brand-avatar{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:104px;
    height:104px;
    border-radius:50%;
    object-fit:cover;
    border:0;
    background:#092331;
    z-index:2;
}

.profile-action-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:10px;
}

.profile-action-row .edit-profile-btn{
    margin-top:0;
}

/* =========================
   LIVE CAMERA
========================= */

.camera-modal{
    position:fixed;
    inset:0;
    background:rgba(0,8,14,.96);
    z-index:12000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.camera-modal.show{
    display:flex;
}

.camera-card{
    width:100%;
    max-width:520px;
    background:#062d3e;
    border:1px solid #ffd000;
    border-radius:22px;
    padding:14px;
    box-shadow:0 15px 50px rgba(0,0,0,.55);
}

.camera-title{
    color:#ffd000;
    text-align:center;
    font-weight:bold;
    font-size:17px;
    margin-bottom:10px;
}

.camera-video-wrap{
    width:100%;
    aspect-ratio:3 / 4;
    max-height:70vh;
    background:#000;
    border-radius:16px;
    overflow:hidden;
}

.camera-video{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

.camera-status{
    color:#d7e2e7;
    text-align:center;
    font-size:13px;
    line-height:1.4;
    margin:9px 4px;
}

.camera-actions{
    display:flex;
    gap:8px;
}

.camera-action-btn{
    flex:1;
    min-height:46px;
    border-radius:13px;
    border:1px solid #ffd000;
    background:#ffd000;
    color:#001b2b;
    font-weight:bold;
    cursor:pointer;
}

.camera-action-btn.cancel{
    background:#073b50;
    color:#ffd000;
}

.camera-action-btn:disabled{
    opacity:.6;
}

/* =========================
   POST PREVIEW
========================= */

.post-preview{
    display:none;
    margin:0 12px 18px;
    background:#062d3e;
    border:1px solid #075a78;
    border-radius:20px;
    padding:12px;
}

.post-preview.show{
    display:block;
}

.post-preview-title{
    color:#ffd000;
    font-size:15px;
    font-weight:bold;
    margin-bottom:10px;
}

.post-preview-image{
    width:100%;
    max-height:500px;
    object-fit:contain;
    background:#00131e;
    border-radius:14px;
    display:block;
}

.post-preview-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.post-picture-btn{
    flex:1;
    border:0;
    border-radius:12px;
    padding:11px;
    font-weight:bold;
    cursor:pointer;
}

.post-picture-btn.publish{
    background:#ffd000;
    color:#001b2b;
}

.post-picture-btn.cancel{
    background:#073b50;
    color:#fff;
    border:1px solid #075a78;
}

/* =========================
   FEED
========================= */

.feed{
    width:100%;
    padding:0 12px;
}

.post{
    background:#062d3e;
    border:1px solid #075a78;
    border-radius:22px;
    overflow:hidden;
    margin:0 0 18px;
}

.post-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
}

.post-avatar{
    width:52px;
    height:52px;
    min-width:52px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #ffd000;
    background:#092331;
}

.post-user{
    flex:1;
    min-width:0;
}

.post-name{
    color:#ffd000;
    font-size:16px;
    font-weight:bold;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.post-time{
    color:#9db0ba;
    font-size:12px;
    margin-top:3px;
}

.follow-wrap{
    display:flex;
    align-items:center;
    gap:6px;
}

.follow-btn{
    border:1px solid #ffd000;
    color:#ffd000;
    background:transparent;
    border-radius:18px;
    padding:7px 11px;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
}

.follow-btn.following{
    background:#ffd000;
    color:#001b2b;
}

.follow-count{
    color:#d7e2e7;
    font-size:12px;
    white-space:nowrap;
}

.post-image-wrap{
    width:100%;
    background:#00131e;
    cursor:pointer;
}

.post-image{
    width:100%;
    height:320px;
    display:block;
    object-fit:cover;
    cursor:pointer;
    transition:transform .2s ease;
}

.post-image:hover{
    transform:scale(1.02);
}

.post-actions{
    display:flex;
    align-items:center;
    padding:9px 12px;
    gap:7px;
    border-top:1px solid #075a78;
}

.action-btn{
    border:0;
    background:#073b50;
    color:#fff;
    border-radius:11px;
    padding:7px 10px;
    font-size:14px;
    cursor:pointer;
}

.action-btn.liked{
    color:#ff3b3b;
}

.click-count{
    margin-left:auto;
    color:#d7e2e7;
    font-size:14px;
}

.comments{
    padding:0 12px 12px;
}

.comment{
    background:#082431;
    border-radius:11px;
    padding:8px 9px;
    margin-top:7px;
}

.comment-name{
    color:#ffd000;
    font-weight:bold;
    font-size:12px;
}

.comment-text{
    color:#fff;
    margin-top:3px;
    font-size:13px;
    line-height:1.35;
}

.comment-box{
    display:flex;
    gap:7px;
    margin-top:8px;
}

.comment-input{
    flex:1;
    min-width:0;
    height:39px;
    border:0;
    outline:0;
    border-radius:11px;
    padding:0 11px;
    background:#fff;
    color:#111;
    font-family:Arial,Helvetica,sans-serif;
    font-size:14px;
}

.comment-send{
    border:0;
    border-radius:11px;
    background:#ffd000;
    color:#001b2b;
    font-weight:bold;
    padding:0 12px;
    font-size:13px;
}

.empty{
    text-align:center;
    padding:40px 15px;
    color:#8fa7b2;
    font-size:14px;
}

/* =========================
   COMPOSER
========================= */

.composer{
    position:fixed;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:100%;
    max-width:760px;
    background:#062d3e;
    border-top:1px solid #075a78;
    padding:9px 12px 11px;
    z-index:3000;
}

.composer-row{
    display:flex;
    align-items:flex-end;
    gap:7px;
}

.composer-btn{
    width:54px;
    height:54px;
    min-width:54px;
    border:0;
    border-radius:50%;
    background:#ffd000;
    color:#001b2b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
    cursor:pointer;
}

.message-box{
    flex:1;
    min-width:0;
    max-height:130px;
    min-height:54px;
    resize:none;
    overflow-y:auto;
    border:0;
    outline:0;
    border-radius:27px;
    padding:15px 17px;
    font-size:17px;
    line-height:1.35;
    background:#fff;
    color:#111;
    font-family:Arial,Helvetica,sans-serif;
}

.hidden-input{
    display:none;
}

/* =========================
   NOTIFICATIONS
========================= */

.notification-panel{
    position:fixed;
    top:15px;
    right:15px;
    width:min(340px,calc(100% - 30px));
    background:#062d3e;
    border:1px solid #ffd000;
    border-radius:18px;
    z-index:5000;
    box-shadow:0 10px 40px rgba(0,0,0,.45);
    display:none;
    overflow:hidden;
}

.notification-panel.show{
    display:block;
}

.notification-title{
    padding:13px;
    background:#001b2b;
    color:#ffd000;
    font-weight:bold;
    border-bottom:1px solid #075a78;
}

.notification-list{
    max-height:300px;
    overflow:auto;
}

.notification-item{
    padding:11px;
    border-bottom:1px solid #075a78;
    font-size:13px;
}

/* =========================
   VIEWER
========================= */

.image-viewer{
    position:fixed;
    inset:0;
    background:rgba(0,8,14,.94);
    z-index:9000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:25px 15px;
}

.image-viewer.show{
    display:flex;
}

.viewer-content{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.viewer-image{
    max-width:96%;
    max-height:90%;
    object-fit:contain;
    border-radius:10px;
}

.viewer-close{
    position:absolute;
    top:12px;
    right:12px;
    width:48px;
    height:48px;
    border:0;
    border-radius:50%;
    background:#ffd000;
    color:#001b2b;
    font-size:30px;
}

.viewer-click-count{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    background:#062d3e;
    border:1px solid #ffd000;
    color:#ffd000;
    padding:8px 14px;
    border-radius:20px;
    font-size:13px;
}

.toast{
    position:fixed;
    left:50%;
    bottom:95px;
    transform:translateX(-50%);
    background:#ffd000;
    color:#001b2b;
    padding:10px 16px;
    border-radius:20px;
    font-weight:bold;
    z-index:10000;
    display:none;
    max-width:90%;
    text-align:center;
    font-size:14px;
}

.toast.show{
    display:block;
}

@media(max-width:500px){
.post-image{
    height:250px;
}
    .intro{
        font-size:15px;
    }

    .intro strong{
        font-size:16px;
    }

    .profile-picture{
        width:68px;
        height:68px;
        min-width:68px;
    }

    .name-input{
        font-size:16px;
    }

    .post-header{
        padding:11px;
    }

    .post-avatar{
        width:50px;
        height:50px;
        min-width:50px;
    }

    .post-name{
        font-size:15px;
    }

    .follow-btn{
        padding:6px 9px;
        font-size:11px;
    }

    .follow-count{
        font-size:11px;
    }

    .composer-btn{
        width:51px;
        height:51px;
        min-width:51px;
    }

    .message-box{
        font-size:16px;
        min-height:51px;
    }
}

</style>
</head>

<body>

<div id="authGate" class="auth-gate">
<div class="auth-card">
<h2 id="authTitle">Join Kulzzy Radio Community</h2>
<p class="auth-subtitle">Use your email and password to create one free account.</p>
<input id="authEmail" class="auth-input" type="email" autocomplete="email" placeholder="Email address">
<input id="authPassword" class="auth-input" type="password" autocomplete="new-password" placeholder="Password (minimum 6 characters)">
<div id="authError" class="auth-error"></div>
<button id="authSubmit" class="auth-submit">Create Free Account</button>
<button id="authSwitch" class="auth-switch">Already have an account? Log in</button>
</div>
</div>

<div class="app">

<div class="intro">
<strong>CELEBRATE, SELL &amp; NETWORK</strong>
with listeners around the world.
</div>


<!-- PROFILE -->

<section id="profileArea" class="profile-area">

<div id="profileEditor">

<div class="profile-row">

<img
id="profilePicture"
class="profile-picture"
src=""
alt="Profile">

<div class="profile-details">

<input
id="nameInput"
class="name-input"
type="text"
maxlength="40"
placeholder="Your name">

<div class="profile-controls">

<input
id="profileFile"
class="profile-file"
type="file"
accept="image/*">

<button
id="saveProfile"
class="save-profile">
Save
</button>

<button
id="cancelProfile"
class="cancel-profile">
Cancel
</button>

</div>

</div>

</div>


<!-- COVER UPLOAD INSIDE SAME PROFILE BOX -->

<div
id="coverUploadArea"
class="cover-upload-area">

<div class="cover-upload-title">
🖼️ Cover Picture
</div>

<input
id="coverFile"
class="cover-file"
type="file"
accept="image/*">

<img
id="coverPreview"
class="cover-preview"
src=""
alt="Cover preview">

</div>

</div>


<!-- SAVED PROFILE -->

<div
id="savedProfileView"
class="profile-saved-view">

}

authSubmit.onclick=async()=>{
    const email=authEmail.value.trim().toLowerCase();
    const password=authPassword.value;
    if(!email||!password){
        authError.textContent="Enter your email and password.";
        return;
    }
    if(password.length<6){
        authError.textContent="Password must be at least 6 characters.";
        return;
    }
    setAuthBusy(true);
    try{
        let credential;
        if(authMode==="signup") credential=await createUserWithEmailAndPassword(auth,email,password);
        else credential=await signInWithEmailAndPassword(auth,email,password);
        firebaseUser=credential.user;

        authPassword.value="";
        hideAuthGate();
        await loadFirebaseProfile();

    }catch(error){
        console.error("Email authentication error:",error);
        const code=error.code||"";
        if(code.includes("email-already-in-use")) authError.textContent="This email already has an account. Please log in.";
        else if(code.includes("invalid-credential")||code.includes("wrong-password")||code.includes("user-not-found")) authError.textContent="Email or password is incorrect.";
        else if(code.includes("invalid-email")) authError.textContent="Please enter a valid email address.";
        else if(code.includes("too-many-requests")) authError.textContent="Too many attempts. Please try again later.";
        else if(code.includes("operation-not-allowed")) authError.textContent="Email/Password sign-in is not enabled in Firebase Authentication.";
        else authError.textContent=error.message||"Authentication failed.";
    }finally{
        setAuthBusy(false);
    }
};

/* =========================
   CLOUDINARY UPLOAD
========================= */

async function uploadToCloudinary(file){

    const fd=
        new FormData();

    fd.append(
        "file",
        file
    );

    fd.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
    );

    const response=
        await fetch(
            `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
            {
                method:"POST",
                body:fd
            }
        );

    const data=
        await response.json();

    if(
        !response.ok ||
        !data.secure_url
    ){

        throw new Error(
            data.error?.message ||
            "Cloudinary upload failed."
        );

    }

    return data.secure_url;
}


/* =========================
   SAVE PROFILE DATABASE
========================= */

async function saveProfileToDatabase(
    profile
){

    await set(
        ref(
            db,
            "profiles/" + userId
        ),
        {
            ...profile,
            uid:userId
        }
    );


    /* Update existing posts */

    const snapshot=
        await get(
            ref(
                db,
                "communityPosts"
            )
        );

    if(snapshot.exists()){

        const changes={};

        snapshot.forEach(
            child=>{

                const post=
                    child.val();

                if(
                    post.uid === userId
                ){

                    changes[
                        `communityPosts/${child.key}/name`
                    ]=
                        profile.name;

                    changes[
                        `communityPosts/${child.key}/avatar`
                    ]=
                        profile.photo;

                }

            }
        );

        if(
            Object.keys(changes).length
        ){

            await update(
                ref(db),
                changes
            );

        }

    }

}

/* =========================
   CAMERA / UPLOAD
========================= */

let cameraStream=null;

function stopLiveCamera(){

    if(cameraStream){

        cameraStream.getTracks().forEach(
            track=>track.stop()
        );

        cameraStream=null;

    }

    cameraVideo.srcObject=null;

    cameraModal.classList.remove(
        "show"
    );

}

async function openLiveCamera(){

    if(!hasProfile()){

        showToast(
            "Save your name and profile picture first."
        );

        openEditor();

        return;

    }

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){

        showToast(
            "Live camera is not supported by this browser."
        );

        return;

    }

    cameraStatus.textContent=
        "Allow camera permission when your browser asks.";

    captureCameraBtn.disabled=true;

    cameraModal.classList.add(
        "show"
    );

    try{

        cameraStream=
            await navigator.mediaDevices.getUserMedia({
                video:{
                    facingMode:{
                        ideal:"environment"
                    },
                    width:{
                        ideal:1280
                    },
                    height:{
                        ideal:1920
                    }
                },
                audio:false
            });

        cameraVideo.srcObject=
            cameraStream;

        await cameraVideo.play();

        captureCameraBtn.disabled=false;

        cameraStatus.textContent=
            "Camera is ready. Tap Take Picture.";

    }catch(error){

        console.error(
            "Camera permission/error:",
            error
        );

        captureCameraBtn.disabled=true;

        if(error && error.name === "NotAllowedError"){

            cameraStatus.textContent=
                "Camera permission was denied. Allow camera access in the browser and tap the camera button again.";

        }else if(error && error.name === "NotFoundError"){

            cameraStatus.textContent=
                "No camera was found on this device.";

        }else{

            cameraStatus.textContent=
                "Unable to open the camera. Please try again.";

        }

    }

}

function captureLiveCameraPicture(){

    if(!cameraStream || !cameraVideo.videoWidth){

        showToast(
            "Camera is not ready yet."
        );

        return;

    }

    const canvas=
        document.createElement(
            "canvas"
        );

    const maxWidth=
        1600;

    const scale=
        Math.min(
            1,
            maxWidth / cameraVideo.videoWidth
        );

    canvas.width=
        Math.round(
            cameraVideo.videoWidth * scale
        );

    canvas.height=
        Math.round(
            cameraVideo.videoHeight * scale
        );

    const context=
        canvas.getContext("2d");

    context.drawImage(
        cameraVideo,
        0,
        0,
        canvas.width,
        canvas.height
    );

    canvas.toBlob(
        blob=>{

            if(!blob){

                showToast(
                    "Could not capture the picture."
                );

                return;

            }

            const file=
                new File(
                    [blob],
                    "kulzzy-camera-" + Date.now() + ".jpg",
                    {
                        type:"image/jpeg",
                        lastModified:Date.now()
                    }
                );

            stopLiveCamera();

            showPostPreview(
                file
            );

        },
        "image/jpeg",
        0.92
    );

}

                "Unable to post picture."
            );

        }finally{

            postPictureBtn.disabled=
                false;

            postPictureBtn.textContent=
                "Post Picture";

        }

    };


cancelPostBtn.onclick=
    cancelPostPreview;


/* =========================
   ESCAPE HTML
========================= */

function esc(value){

    return String(
        value || ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


function time(timestamp){

    return timestamp
        ? new Date(
            timestamp
          ).toLocaleString(
            [],
            {
                month:"short",
                day:"numeric",
                hour:"numeric",
                minute:"2-digit"
            }
          )
        : "";

}


/* =========================
   FOLLOWER COUNT
========================= */

async function getFollowerCount(
    owner
){

    try{

        const snap=
            await get(
                ref(
                    db,
                    `followers/${owner}`
                )
            );

        return snap.exists()
            ? Object.keys(
                snap.val()
              ).length
            : 0;

    }catch(error){

        console.error(
            error
        );

        return 0;

    }

}


async function follow(
    owner,
    button,
    countElement
){

    if(
        owner === userId
    ){

        showToast(
            "You cannot follow yourself."
        );

        return;
    }


    if(!userId){

        return;
    }


    const followRef=
        ref(
            db,
            `followers/${owner}/${userId}`
        );


    const snapshot=
        await get(
            followRef
        );


    if(snapshot.exists()){

        await set(
            followRef,
            null
        );

        button.textContent=
            "Follow Me";

        button.classList.remove(
            "following"
        );

    }else{

        await set(
            followRef,
            {

                uid:
                    userId,

                name:
                    savedProfile?.name ||
                    "Listener",

                time:
                    Date.now()

            }
        );


        button.textContent=
            "Following";

        button.classList.add(
            "following"
        );


        await set(
            push(
                ref(
                    db,
                    "notifications"
                )
            ),
            {

                type:
                    "follow",

                uid:
                    owner,

                fromUid:
                    userId,

                name:
                    savedProfile?.name ||
                    "Listener",

                text:
                    (
                        savedProfile?.name ||
                        "Someone"
                    ) +
                    " followed you.",

                time:
                    Date.now()

            }
        );

    }


    countElement.textContent=
        await getFollowerCount(
            owner
        );

}


async function setFollow(
    owner,
    button,
    countElement
){

    if(
        owner === userId
    ){

        button.style.display=
            "none";

        countElement.textContent=
            await getFollowerCount(
                owner
            ) +
            " followers";

        return;
    }


    const snapshot=
        await get(
            ref(
                db,
                `followers/${owner}/${userId}`
            )
        );


    if(snapshot.exists()){

        button.textContent=
            "Following";

        button.classList.add(
            "following"
        );

    }


    countElement.textContent=
        await getFollowerCount(
            owner
        ) +
        " followers";

}


/* =========================
   LIKE
========================= */

async function like(
    id,
    button,
    count
){

    if(!userId){

        return;
    }


    const likeRef=
        ref(
            db,
            `postLikes/${id}/${userId}`
        );


    const snapshot=
        await get(
            likeRef
        );


    const countRef=
        ref(
            db,
            `communityPosts/${id}/likes`
        );


    if(snapshot.exists()){

        await set(
            likeRef,
            null
        );

        await runTransaction(
            countRef,
            current=>
                Math.max(
                    0,
                    Number(
                        current || 0
                    ) - 1
                )
        );

        button.classList.remove(
            "liked"
        );

    }else{

        await set(
            likeRef,
            true
        );

        await runTransaction(
            countRef,
            current=>
                Number(
                    current || 0
                ) + 1
        );

        button.classList.add(
            "liked"
        );

    }


    count.textContent=
        (
            await get(
                countRef
            )
        ).val() || 0;

}


/* =========================
   CLICK COUNT
========================= */

async function clickPost(
    id,
    url
){

    viewerImage.src=
        url;

    imageViewer.classList.add(
        "show"
    );


    const localKey=
        "kulzzy_clicked_" +
        id;


    const countRef=
        ref(
            db,
            `communityPosts/${id}/clicks`
        );


    if(
        !localStorage.getItem(
            localKey
        )
    ){

        localStorage.setItem(
            localKey,
            "1"
        );


        await runTransaction(
            countRef,
            current=>
                Number(
                    current || 0
                ) + 1
        );

    }


    const snapshot=
        await get(
            countRef
        );


    viewerClickCount.textContent=
        "👆 " +
        (
            snapshot.val() ||
            0
        );

}

/* =========================
   COMMENTS
========================= */

async function comment(
    id,
    input
){

    if(!hasProfile()){

        showToast(
            "Save your profile first."
        );

        openEditor();

        return;
    }


    const text=
        input.value.trim();


    if(!text){

        return;
    }


    await set(
        push(
            ref(
                db,
                `comments/${id}`
            )
        ),
        {

            uid:
                userId,

            name:
                savedProfile.name,

            text:
                text,

            time:
                Date.now()

        }
    );


    input.value=
        "";

}


function comments(
    id,
    box
){

    onValue(
        ref(
            db,
            `comments/${id}`
        ),
        snapshot=>{

            box.innerHTML=
                "";

            if(
                !snapshot.exists()
            ){

                return;

            }


            snapshot.forEach(
                child=>{

                    const data=
                        child.val();

                    const div=
                        document.createElement(
                            "div"
                        );

                    div.className=
                        "comment";

                    div.innerHTML=
                        `
                        <div class="comment-name">
                            ${esc(data.name)}
                        </div>

                        <div class="comment-text">
                            ${esc(data.text)}
                        </div>
                        `;

                    box.appendChild(
                        div
                    );

                }
            );

        }
    );

}


/* =========================
   RENDER POSTS
========================= */

function renderPosts(
    snapshot
){

    feed.innerHTML=
        "";


    if(
        !snapshot.exists()
    ){

        feed.appendChild(
            emptyFeed
        );

        return;

    }


    const posts=[];


    snapshot.forEach(
        child=>{

            const data=
                child.val();


            if(
                data &&
                data.image
            ){

                posts.push({

                    id:
                        child.key,

                    ...data

                });

            }

        }
    );


    posts.sort(
        (a,b)=>
            (b.time || 0) -
            (a.time || 0)
    );


    if(!posts.length){

        feed.appendChild(
            emptyFeed
        );

        return;

    }


    posts.forEach(
        post=>{

            const article=
                document.createElement(
                    "article"
                );


            article.className=
                "post";


            article.innerHTML=
                `

                <div class="post-header">

                    <img
                        class="post-avatar"
                        src="${esc(
                            post.avatar ||
                            DEFAULT_PROFILE
                        )}">

                    <div class="post-user">

                        <div class="post-name">
                            ${esc(
                                post.name ||
                                "Listener"
                            )}
                        </div>

                        <div class="post-time">
                            ${time(
                                post.time
                            )}
                        </div>

                    </div>


                    <div class="follow-wrap">

                        <button
                            class="follow-btn">
                            Follow Me
                        </button>

                        <span
                            class="follow-count">
                            0 followers
                        </span>

                    </div>

                </div>


                <div
                    class="post-image-wrap">

                    <img
                        class="post-image"
                        src="${esc(
                            post.image
                        )}"
                        alt="Community post">

                </div>


                <div class="post-actions">

                    <button
                        class="action-btn like-btn">

                        ❤️

                        <span class="like-count">
                            ${post.likes || 0}
                        </span>

                    </button>


                    <button
                        class="action-btn">

                        💬 Comment

                    </button>


                    <div
                        class="click-count">

                        👆

                        <span>
                            ${post.clicks || 0}
                        </span>

                    </div>

                </div>


                <div class="comments">

                    <div
                        class="comment-list">
                    </div>


                    <div class="comment-box">

                        <input
                            class="comment-input"
                            maxlength="300"
                            placeholder="Comment...">

                        <button
                            class="comment-send">
                            Send
                        </button>

                    </div>

                </div>

                `;


            const followButton=
                article.querySelector(
                    ".follow-btn"
                );


            const followCount=
                article.querySelector(
                    ".follow-count"
                );


            const image=
                article.querySelector(
                    ".post-image"
                );


            const likeButton=
                article.querySelector(
                    ".like-btn"
                );


            const likeCount=
                article.querySelector(
                    ".like-count"
                );


            const commentInput=
                article.querySelector(
                    ".comment-input"
                );


            const commentSend=
                article.querySelector(
                    ".comment-send"
                );


            followButton.onclick=
                ()=>{

                    follow(
                        post.uid,
                        followButton,
                        followCount
                    );

                };


            setFollow(
                post.uid,
                followButton,
                followCount
            );


            image.onclick=
                ()=>{

                    clickPost(
                        post.id,
                        post.image
                    );

                };


            likeButton.onclick=
                ()=>{

                    like(
                        post.id,
                        likeButton,
                        likeCount
                    );

                };


            commentSend.onclick=
                ()=>{

                    comment(
                        post.id,
                        commentInput
                    );

                };


            commentInput.onkeydown=
                event=>{

                    if(
                        event.key ===
                        "Enter"
                    ){

                        event.preventDefault();

                        comment(
                            post.id,
                            commentInput
                        );

                    }

                };


            comments(
                post.id,
                article.querySelector(
                    ".comment-list"
                )
            );


            feed.appendChild(
                article
            );

        }
    );

}


/* =========================
   REALTIME POSTS
========================= */

onValue(

        );

);


/* =========================
   NOTIFICATIONS
========================= */

onValue(
    ref(
        db,
        "notifications"
    ),
    snapshot=>{

        notificationList.innerHTML=
            "";


        if(
            !snapshot.exists()
        ){

            notificationList.innerHTML=
                `
                <div class="notification-item">
                    No notifications.
                </div>
                `;

            return;

        }


        const items=[];


        snapshot.forEach(
            child=>{

                items.push(
                    child.val()
                );

            }
        );


        items.sort(
            (a,b)=>
                (b.time || 0) -
                (a.time || 0)
        );


        items
        .slice(0,30)
        .forEach(
            item=>{

                const div=
                    document.createElement(
                        "div"
                    );

                div.className=
                    "notification-item";

                div.textContent=
                    item.text ||
                    "New activity.";

                notificationList.appendChild(
                    div
                );

            }
        );

    }
);


/* =========================
   LOAD USER PROFILE
========================= */

async function loadFirebaseProfile(){

    if(!userId){

        return;

    }


    try{

        const snapshot=
            await get(
                ref(
                    db,
                    "profiles/" +
                    userId
                )
            );


        if(
            snapshot.exists()
        ){

            const profile=
                snapshot.val();


            savedProfile={

                name:
                    profile.name ||
                    "",

                photo:
                    profile.photo ||
                    "",

                cover:
                    profile.cover ||
                    "",

                updatedAt:
                    profile.updatedAt ||
                    Date.now()

            };


            localStorage.setItem(
                "kulzzyCommunityProfile",
                JSON.stringify(
                    savedProfile
                )
            );


            if(
                savedProfile.name &&
                savedProfile.photo
            ){

                closeEditor();

            }

        }

    }catch(error){

        console.error(
            "Profile loading error:",
            error
        );

    }

}
