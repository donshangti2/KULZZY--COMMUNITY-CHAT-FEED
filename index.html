<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Kulzzy Radio Community</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#001b2b;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

.app{
    width:100%;
    max-width:760px;
    margin:auto;
    min-height:100vh;
    background:#001b2b;
    padding-bottom:145px;
}

/* =========================
   INTRO
========================= */

.intro{
    margin:0 18px 18px;
    padding:18px 16px;
    background:#001b2b;
    text-align:center;
    color:#e9f2f6;
    font-size:16px;
    line-height:1.45;
}

.intro strong{
    color:#ffd000;
    font-size:16px;
    font-weight:700;
}

/* =========================
   PROFILE
========================= */

.profile-area{
    margin:0 18px 18px;
    padding:18px;
    background:#062d3e;
    border:1px solid #075a78;
    border-radius:22px;
}
/* COVER PICTURE */
.cover-area{
    width:100%;
    margin-bottom:16px;
}

.cover-preview{
    width:100%;
    height:150px;
    border-radius:16px;
    overflow:hidden;
    background:#092331;
    border:1px solid #075a78;
    position:relative;
}

.cover-preview img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

.cover-placeholder{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#8fa7b2;
    font-size:14px;
    text-align:center;
}

.cover-controls{
    margin-top:9px;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}

.cover-upload-btn{
    flex:1;
    min-width:150px;
    border:1px solid #ffd000;
    background:#ffd000;
    color:#001b2b;
    border-radius:13px;
    padding:9px 12px;
    font-weight:bold;
    font-size:13px;
    cursor:pointer;
}

.cover-edit-btn{
    border:1px solid #ffd000;
    background:transparent;
    color:#ffd000;
    border-radius:13px;
    padding:9px 12px;
    font-weight:bold;
    font-size:13px;
    cursor:pointer;
}

.cover-status{
    width:100%;
    color:#9db0ba;
    font-size:12px;
    text-align:center;
    margin-top:3px;
}

.hidden-cover-input{
    display:none;
}
    
.profile-row{
    display:flex;
    align-items:center;
    gap:14px;
}

.profile-picture{
    width:72px;
    height:72px;
    min-width:72px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #ffd000;
    background:#092331;
}

.profile-details{
    flex:1;
    min-width:0;
}

.name-input{
    width:100%;
    height:46px;
    border:0;
    outline:0;
    border-radius:14px;
    padding:0 13px;
    font-size:17px;
    background:#fff;
    color:#111;
}

.profile-controls{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:9px;
    flex-wrap:wrap;
}

.profile-file{
    flex:1;
    min-width:130px;
    color:#fff;
    font-size:12px;
}

.save-profile,
.cancel-profile{
    border-radius:13px;
    padding:9px 13px;
    font-weight:bold;
    cursor:pointer;
}

.save-profile{
    border:2px solid #ffd000;
    background:#ffd000;
    color:#001b2b;
}

.cancel-profile{
    border:1px solid #ffd000;
    background:transparent;
    color:#ffd000;
    display:none;
}

/* COVER */

.cover-upload-area{
    margin-top:14px;
    padding:12px;
    background:#07384b;
    border:1px dashed #ffd000;
    border-radius:15px;
}

.cover-upload-title{
    color:#ffd000;
    font-size:14px;
    font-weight:bold;
    margin-bottom:8px;
}

.cover-file{
    width:100%;
    color:#fff;
    font-size:12px;
}

.cover-preview{
    width:100%;
    height:130px;
    object-fit:cover;
    border-radius:14px;
    border:2px solid #ffd000;
    margin-top:10px;
    display:none;
}

.saved-cover{
    width:100%;
    height:130px;
    object-fit:cover;
    border-radius:14px;
    border:2px solid #ffd000;
    margin-bottom:12px;
    display:none;
}

/* SAVED PROFILE */

.profile-saved-view{
    display:none;
    text-align:center;
}
.profile-cover{
    width:100%;
    height:150px;
    border-radius:18px;
    overflow:hidden;
    background:#092331;
    border:1px solid #075a78;
    margin-bottom:15px;
    position:relative;
}

.profile-cover img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.cover-upload-box{
    margin-bottom:15px;
    padding:12px;
    border:1px dashed #ffd000;
    border-radius:14px;
    text-align:center;
    color:#ffd000;
    font-size:13px;
}

.cover-upload-box input{
    width:100%;
    margin-top:8px;
    color:#fff;
}

.edit-cover-btn{
    margin-top:8px;
    border:1px solid #ffd000;
    background:#062d3e;
    color:#ffd000;
    border-radius:14px;
    padding:7px 12px;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
}
.profile-saved-view.show{
    display:block;
}

.saved-profile-picture{
    width:72px;
    height:72px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #ffd000;
    background:#092331;
}

.saved-profile-name{
    margin-top:8px;
    color:#ffd000;
    font-size:17px;
    font-weight:bold;
    word-break:break-word;
}

.edit-profile-btn{
    margin-top:10px;
    border:1px solid #ffd000;
    background:#062d3e;
    color:#ffd000;
    border-radius:17px;
    padding:8px 14px;
    font-weight:bold;
    font-size:13px;
    cursor:pointer;
}

/* =========================
   POST PREVIEW
========================= */

.post-preview{
    display:none;
    margin:0 12px 18px;
    background:#062d3e;
    border:1px solid #075a78;
    border-radius:20px;
    padding:12px;
}

.post-preview.show{
    display:block;
}

.post-preview-title{
    color:#ffd000;
    font-size:15px;
    font-weight:bold;
    margin-bottom:10px;
}

.post-preview-image{
    width:100%;
    max-height:500px;
    object-fit:contain;
    background:#00131e;
    border-radius:14px;
    display:block;
}

.post-preview-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.post-picture-btn{
    flex:1;
    border:0;
    border-radius:12px;
    padding:11px;
    font-weight:bold;
    cursor:pointer;
}

.post-picture-btn.publish{
    background:#ffd000;
    color:#001b2b;
}

.post-picture-btn.cancel{
    background:#073b50;
    color:#fff;
    border:1px solid #075a78;
}

/* =========================
   FEED
========================= */

.feed{
    width:100%;
    padding:0 12px;
}

.post{
    background:#062d3e;
    border:1px solid #075a78;
    border-radius:22px;
    overflow:hidden;
    margin:0 0 18px;
}

.post-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
}

.post-avatar{
    width:52px;
    height:52px;
    min-width:52px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #ffd000;
    background:#092331;
}

.post-user{
    flex:1;
    min-width:0;
}

.post-name{
    color:#ffd000;
    font-size:16px;
    font-weight:bold;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.post-time{
    color:#9db0ba;
    font-size:12px;
    margin-top:3px;
}

.follow-wrap{
    display:flex;
    align-items:center;
    gap:6px;
}

.follow-btn{
    border:1px solid #ffd000;
    color:#ffd000;
    background:transparent;
    border-radius:18px;
    padding:7px 11px;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
}

.follow-btn.following{
    background:#ffd000;
    color:#001b2b;
}

.follow-count{
    color:#d7e2e7;
    font-size:12px;
    white-space:nowrap;
}

.post-image-wrap{
    width:100%;
    background:#00131e;
    cursor:pointer;
}

.post-image{
    width:100%;
    height:320px;
    display:block;
    object-fit:cover;
    cursor:pointer;
    transition:transform .2s ease;
}

.post-image:hover{
    transform:scale(1.02);
}

.post-actions{
    display:flex;
    align-items:center;
    padding:9px 12px;
    gap:7px;
    border-top:1px solid #075a78;
}

.action-btn{
    border:0;
    background:#073b50;
    color:#fff;
    border-radius:11px;
    padding:7px 10px;
    font-size:14px;
    cursor:pointer;
}

.action-btn.liked{
    color:#ff3b3b;
}

.click-count{
    margin-left:auto;
    color:#d7e2e7;
    font-size:14px;
}

.comments{
    padding:0 12px 12px;
}

.comment{
    background:#082431;
    border-radius:11px;
    padding:8px 9px;
    margin-top:7px;
}

.comment-name{
    color:#ffd000;
    font-weight:bold;
    font-size:12px;
}

.comment-text{
    color:#fff;
    margin-top:3px;
    font-size:13px;
    line-height:1.35;
}

.comment-box{
    display:flex;
    gap:7px;
    margin-top:8px;
}

.comment-input{
    flex:1;
    min-width:0;
    height:39px;
    border:0;
    outline:0;
    border-radius:11px;
    padding:0 11px;
    background:#fff;
    color:#111;
    font-family:Arial,Helvetica,sans-serif;
    font-size:14px;
}

.comment-send{
    border:0;
    border-radius:11px;
    background:#ffd000;
    color:#001b2b;
    font-weight:bold;
    padding:0 12px;
    font-size:13px;
}

.empty{
    text-align:center;
    padding:40px 15px;
    color:#8fa7b2;
    font-size:14px;
}

/* =========================
   COMPOSER
========================= */

.composer{
    position:fixed;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:100%;
    max-width:760px;
    background:#062d3e;
    border-top:1px solid #075a78;
    padding:9px 12px 11px;
    z-index:3000;
}

.composer-row{
    display:flex;
    align-items:flex-end;
    gap:7px;
}

.composer-btn{
    width:54px;
    height:54px;
    min-width:54px;
    border:0;
    border-radius:50%;
    background:#ffd000;
    color:#001b2b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
    cursor:pointer;
}

.message-box{
    flex:1;
    min-width:0;
    max-height:130px;
    min-height:54px;
    resize:none;
    overflow-y:auto;
    border:0;
    outline:0;
    border-radius:27px;
    padding:15px 17px;
    font-size:17px;
    line-height:1.35;
    background:#fff;
    color:#111;
    font-family:Arial,Helvetica,sans-serif;
}

.hidden-input{
    display:none;
}

/* =========================
   NOTIFICATIONS
========================= */

.notification-panel{
    position:fixed;
    top:15px;
    right:15px;
    width:min(340px,calc(100% - 30px));
    background:#062d3e;
    border:1px solid #ffd000;
    border-radius:18px;
    z-index:5000;
    box-shadow:0 10px 40px rgba(0,0,0,.45);
    display:none;
    overflow:hidden;
}

.notification-panel.show{
    display:block;
}

.notification-title{
    padding:13px;
    background:#001b2b;
    color:#ffd000;
    font-weight:bold;
    border-bottom:1px solid #075a78;
}

.notification-list{
    max-height:300px;
    overflow:auto;
}

.notification-item{
    padding:11px;
    border-bottom:1px solid #075a78;
    font-size:13px;
}

/* =========================
   VIEWER
========================= */

.image-viewer{
    position:fixed;
    inset:0;
    background:rgba(0,8,14,.94);
    z-index:9000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:25px 15px;
}

.image-viewer.show{
    display:flex;
}

.viewer-content{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.viewer-image{
    max-width:96%;
    max-height:90%;
    object-fit:contain;
    border-radius:10px;
}

.viewer-close{
    position:absolute;
    top:12px;
    right:12px;
    width:48px;
    height:48px;
    border:0;
    border-radius:50%;
    background:#ffd000;
    color:#001b2b;
    font-size:30px;
}

.viewer-click-count{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    background:#062d3e;
    border:1px solid #ffd000;
    color:#ffd000;
    padding:8px 14px;
    border-radius:20px;
    font-size:13px;
}

.toast{
    position:fixed;
    left:50%;
    bottom:95px;
    transform:translateX(-50%);
    background:#ffd000;
    color:#001b2b;
    padding:10px 16px;
    border-radius:20px;
    font-weight:bold;
    z-index:10000;
    display:none;
    max-width:90%;
    text-align:center;
    font-size:14px;
}

.toast.show{
    display:block;
}

@media(max-width:500px){
.post-image{
    height:250px;
}
    .intro{
        font-size:15px;
    }

    .intro strong{
        font-size:16px;
    }

    .profile-picture{
        width:68px;
        height:68px;
        min-width:68px;
    }

    .name-input{
        font-size:16px;
    }

    .post-header{
        padding:11px;
    }

    .post-avatar{
        width:50px;
        height:50px;
        min-width:50px;
    }

    .post-name{
        font-size:15px;
    }

    .follow-btn{
        padding:6px 9px;
        font-size:11px;
    }

    .follow-count{
        font-size:11px;
    }

    .composer-btn{
        width:51px;
        height:51px;
        min-width:51px;
    }

    .message-box{
        font-size:16px;
        min-height:51px;
    }
}

</style>
</head>

<body>

<div class="app">

<div class="intro">
<strong>CELEBRATE, SELL &amp; NETWORK</strong>
with listeners around the world.
</div>


<!-- PROFILE -->

<section id="profileArea" class="profile-area">

<div id="profileEditor">

<div class="profile-row">

<input
id="nameInput"

<div class="profile-controls">

<input
id="profileFile"

<button
id="saveProfile"

Save
</button>

<button
id="cancelProfile"

Cancel
</button>

</div>

</div>

</div>


<!-- COVER UPLOAD INSIDE SAME PROFILE BOX -->

<div
id="coverUploadArea"

<img

</div>


<!-- SAVED PROFILE -->

<div

</div>

</section>


<!-- POST PREVIEW -->

<div

<img

<button
id="cancelPostBtn"

</div>

</div>


<!-- FEED -->

<main id="feed" class="feed">

<div
class="empty"

No community posts yet.
</div>

</main>

</div>


<!-- COMPOSER -->

<div class="composer">

<div class="composer-row">

<button
id="cameraBtn"
class="composer-btn">
📷
</button>

<input
id="cameraInput"
class="hidden-input"
type="file"
accept="image/*"
capture="environment">


<textarea
id="messageBox"
class="message-box"
rows="1"
maxlength="1000"
placeholder="Type a message...">
</textarea>


<button
id="uploadBtn"
class="composer-btn">
🖼️
</button>

<input
id="uploadInput"
class="hidden-input"
type="file"
accept="image/*">


<button
id="sendBtn"
class="composer-btn">
➤
</button>

</div>

</div>


<!-- NOTIFICATIONS -->

<div
id="notificationPanel"
class="notification-panel">

<div class="notification-title">
🔔 Notifications
</div>

<div
id="notificationList"
class="notification-list">
</div>

</div>


<!-- IMAGE VIEWER -->

<div
id="imageViewer"
class="image-viewer">

<div class="viewer-content">

<button
id="viewerClose"
class="viewer-close">
×
</button>

<img
id="viewerImage"
class="viewer-image"
src=""
alt="Community post">

<div
id="viewerClickCount"
class="viewer-click-count">
👆 0
</div>

</div>

</div>


<div
id="toast"
class="toast">
</div>

let firebaseUser=
    null;

let userId=
    localStorage.getItem(
        "kulzzyCommunityUserId"
    ) || "";


function setStableUserId(uid){

    userId=
        uid;

    localStorage.setItem(
        "kulzzyCommunityUserId",
        uid
    );
}


async function ensureAuthentication(){

    return new Promise(
        async resolve=>{

            let resolved=false;

            onAuthStateChanged(
                auth,
                user=>{

                    if(user){

                        firebaseUser=
                            user;

                        setStableUserId(
                            user.uid
                        );

                        if(!resolved){

                            resolved=true;

                            resolve(user);
                        }
                    }

                }
            );

            try{

                if(!auth.currentUser){

                    await signInAnonymously(
                        auth
                    );

                }

            }catch(error){

                console.error(
                    "Authentication:",
                    error
                );

                if(!resolved){

                    resolved=true;

                    resolve(null);
                }

            }

        }
    );
}

/* =========================
   CLOUDINARY UPLOAD
========================= */

async function uploadToCloudinary(file){

    const fd=
        new FormData();

    fd.append(
        "file",
        file
    );

    fd.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
    );

    const response=
        await fetch(
            `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
            {
                method:"POST",
                body:fd
            }
        );

    const data=
        await response.json();

    if(
        !response.ok ||
        !data.secure_url
    ){

        throw new Error(
            data.error?.message ||
            "Cloudinary upload failed."
        );

    }

    return data.secure_url;
}


/* =========================
   SAVE PROFILE DATABASE
========================= */

async function saveProfileToDatabase(
    profile
){

    await set(
        ref(
            db,
            "profiles/" + userId
        ),
        {
            ...profile,
            uid:userId
        }
    );


    /* Update existing posts */

    const snapshot=
        await get(
            ref(
                db,
                "communityPosts"
            )
        );

    if(snapshot.exists()){

        const changes={};

        snapshot.forEach(
            child=>{

                const post=
                    child.val();

                if(
                    post.uid === userId
                ){

                    changes[
                        `communityPosts/${child.key}/name`
                    ]=
                        profile.name;

                    changes[
                        `communityPosts/${child.key}/avatar`
                    ]=
                        profile.photo;

                }

            }
        );

        if(
            Object.keys(changes).length
        ){

            await update(
                ref(db),
                changes
            );

        }

    }

}

/* =========================
   ESCAPE HTML
========================= */

function esc(value){

    return String(
        value || ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


function time(timestamp){

    return timestamp
        ? new Date(
            timestamp
          ).toLocaleString(
            [],
            {
                month:"short",
                day:"numeric",
                hour:"numeric",
                minute:"2-digit"
            }
          )
        : "";

}

async function like(
    id,
    button,
    count
){

    if(!userId){

        return;
    }


    const likeRef=
        ref(
            db,
            `postLikes/${id}/${userId}`
        );


    const snapshot=
        await get(
            likeRef
        );


    const countRef=
        ref(
            db,
            `communityPosts/${id}/likes`
        );


    if(snapshot.exists()){

        await set(
            likeRef,
            null
        );

        await runTransaction(
            countRef,
            current=>
                Math.max(
                    0,
                    Number(
                        current || 0
                    ) - 1
                )
        );

        button.classList.remove(
            "liked"
        );

    }else{

        await set(
            likeRef,
            true
        );

        await runTransaction(
            countRef,
            current=>
                Number(
                    current || 0
                ) + 1
        );

        button.classList.add(
            "liked"
        );

    }


    count.textContent=
        (
            await get(
                countRef
            )
        ).val() || 0;

}

    ){

        feed.appendChild(
            emptyFeed
        );

        return;

    }


    const posts=[];


    snapshot.forEach(
        child=>{

            const data=
                child.val();


            if(
                data &&
                data.image

                posts.push({

                    id:

                    ...data

    );

                            ${post.clicks || 0}
                        </span>

                    </div>

                </div>


                <div class="comments">

                    <div
                        class="comment-list">
                    </div>


                    <div class="comment-box">

                        <input
                            class="comment-input"
                            maxlength="300"
                            placeholder="Comment...">

                        <button
                            class="comment-send">
                            Send
                        </button>

                    </div>

                </div>

                `;


            const followButton=
                article.querySelector(
                    ".follow-btn"
                );


            const followCount=
                article.querySelector(
                    ".follow-count"
                );


            const image=
                article.querySelector(
                    ".post-image"
                );


            const likeButton=
                article.querySelector(
                    ".like-btn"
                );


            const likeCount=
                article.querySelector(
                    ".like-count"
                );


            const commentInput=
                article.querySelector(
                    ".comment-input"
                );


            const commentSend=
                article.querySelector(
                    ".comment-send"
                );


            followButton.onclick=
                ()=>{

                    follow(
                        post.uid,
                        followButton,
                        followCount
                    );

                };


            setFollow(
                post.uid,
                followButton,
                followCount
            );


            image.onclick=
                ()=>{

                    clickPost(
                        post.id,
                        post.image
                    );

                };


            likeButton.onclick=
                ()=>{

                    like(
                        post.id,
                        likeButton,
                        likeCount
                    );

                };


            commentSend.onclick=
                ()=>{

                    comment(
                        post.id,
                        commentInput
                    );

                };


            commentInput.onkeydown=
                event=>{

                    if(
                        event.key ===
                        "Enter"
                    ){

                        event.preventDefault();

                        comment(
                            post.id,
                            commentInput
                        );

                    }

                };


            comments(
                post.id,
                article.querySelector(
                    ".comment-list"
                )
            );


            feed.appendChild(
                article
            );

        }
    );

}

========================= */

            <div class="empty">
                Unable to load community posts.
            </div>
            `;

    }
);


/* =========================
   NOTIFICATIONS
========================= */

onValue(
    ref(
        db,
        "notifications"
    ),
    snapshot=>{

        notificationList.innerHTML=
            "";


        if(
            !snapshot.exists()
        ){

            notificationList.innerHTML=
                `
                <div class="notification-item">
                    No notifications.
                </div>
                `;

            return;

        }


        const items=[];


        snapshot.forEach(
            child=>{

                items.push(
                    child.val()
                );

            }
        );


        items.sort(
            (a,b)=>
                (b.time || 0) -
                (a.time || 0)
        );


        items
        .slice(0,30)
        .forEach(
            item=>{

                const div=
                    document.createElement(
                        "div"
                    );

                div.className=
                    "notification-item";

                div.textContent=
                    item.text ||
                    "New activity.";

                notificationList.appendChild(
                    div
                );

            }
        );

    }
);


/* =========================
   LOAD USER PROFILE
========================= */

async function loadFirebaseProfile(){

    if(!userId){

        return;

    }


    try{

        const snapshot=
            await get(
                ref(
                    db,
                    "profiles/" +
                    userId
                )
            );


        if(
            snapshot.exists()
        ){

            const profile=
                snapshot.val();


            savedProfile={

                name:
                    profile.name ||
                    "",

                photo:
                    profile.photo ||
                    "",

                cover:
                    profile.cover ||
                    "",

                updatedAt:
                    profile.updatedAt ||
                    Date.now()

            };


            localStorage.setItem(
                "kulzzyCommunityProfile",
                JSON.stringify(
                    savedProfile
                )
            );


            if(
                savedProfile.name &&
                savedProfile.photo
            ){

                closeEditor();

            }

        }

    }catch(error){

        console.error(
            "Profile loading error:",
            error
        );

    }

}


/* =========================
   START
========================= */

ensureAuthentication()
.then(
    async user=>{

        if(user){

            setStableUserId(
                user.uid
            );

            await loadFirebaseProfile();
            await loadCoverPicture();
        }

    }
);
